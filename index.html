<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>פלייגראונד</title>
<meta name="theme-color" content="#081325">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="פלייגראונד">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-512.png"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>*{box-sizing:border-box}html,body{margin:0}
/* Layout: Playground-branded phone app. Mor: Today (day strip, summary, 5 meal cards with option sheets, daily habits, note) / Menu (her full plan) / Measures (weekly weigh-in, circumferences, weekly check-in). Tal (owner only): live coach dashboard. Single committed navy look from the logo. */
:root{
  color-scheme:dark;
  --bg:#081325; --navy:#0c1d33; --s1:#11243e; --s2:#173050; --s3:#22406a; --line:#ffffff17;
  --ink:#f5f7fb; --muted:#93a6c2; --dim:#5f7596;
  --hot:#ff6b4a; --food:#7bd389; --habit:#ffc857; --mes:#5bb8ff; --wk:#9d8cff;
  --ok:#4fd18b; --warn:#ffc857; --bad:#ff5a5a;
  --font:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);direction:rtl;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:12px}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:12px 120px;position:relative}
.app::before{content:"";position:fixed;inset:-10% -30% auto;height:520px;background:radial-gradient(closest-side,#1d4a8a55,transparent 70%),radial-gradient(closest-side at 85% 30%,#7bd3891a,transparent 70%);pointer-events:none;z-index:0}
.app>*{position:relative;z-index:1}
.view{display:flex;flex-direction:column;gap:18px;animation:fade .3s ease}
.view[hidden]{display:none!important}
@keyframes fade{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}

.brand{display:flex;align-items:center;gap:10px;padding-top:4px}
.brand img{height:22px;width:auto}
.brand b{font-weight:800;letter-spacing:.18em;font-size:13px;direction:ltr}
.save{margin-inline-start:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.save.ok{color:var(--ok)} .save.err{color:var(--bad);border-color:#ff5a5a66}
.banner{background:#ffc85722;border:1px solid #ffc85766;border-radius:16px;padding:12px 14px;font-size:14px}
.banner[hidden]{display:none}

.hello{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--s2);border:2px solid var(--food);flex:none}
.hello div{display:flex;flex-direction:column;min-width:0}
.hello small{color:var(--muted);font-size:13px}
.hello b{font-size:20px;font-weight:700}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dy{display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:8px 0}
.dy small{font-size:11px;color:var(--muted)}
.dy b{font-size:15px;font-weight:600}
.dy i{width:6px;height:6px;border-radius:50%;background:transparent}
.dy.has i{background:var(--food)}
.dy[aria-pressed="true"]{background:var(--ink);color:var(--navy)}
.dy[aria-pressed="true"] small{color:var(--navy)}

.sum{background:linear-gradient(160deg,var(--s2),var(--navy) 65%);border:1px solid var(--line);border-radius:26px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;position:relative;overflow:hidden}
.sum .wm{position:absolute;left:-30px;bottom:-34px;width:170px;opacity:.06;pointer-events:none}
.ring{width:104px;height:104px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:#ffffff14;stroke-width:10}
.ring .br{fill:none;stroke:var(--food);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .in b{font-size:24px;font-weight:800;line-height:1}
.ring .in small{font-size:11px;color:var(--muted)}
.facts{display:flex;flex-direction:column;gap:8px;min-width:0}
.fact{display:flex;align-items:center;gap:8px;font-size:14px}
.fact i{width:9px;height:9px;border-radius:50%;flex:none}
.fact span{margin-inline-start:auto;color:var(--muted);font-size:13px;text-align:left}
.sum .cap{grid-column:1/-1;font-size:12px;color:var(--dim);margin:0}

.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sh h2{margin:0;font-size:19px;font-weight:700}
.sh span{color:var(--muted);font-size:13px}

.meal{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:12px;text-align:right;width:100%}
.meal .ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--food) 18%,var(--s2))}
.meal .ic svg{width:22px;height:22px;stroke:var(--food);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.meal .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.meal .tx b{font-size:16px}
.meal .tx small{color:var(--muted);font-size:13px}
.meal .tx em{font-style:normal;font-size:14px;color:var(--food);overflow-wrap:anywhere}
.meal .tx em.other{color:var(--habit)}
.meal .st{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--s3);display:grid;place-items:center}
.meal .st svg{width:14px;height:14px;stroke:var(--navy);stroke-width:3;fill:none;opacity:0}
.meal.done .st{background:var(--food);border-color:var(--food)}
.meal.done .st svg{opacity:1}
.meal.done .ic{background:var(--food)}
.meal.done .ic svg{stroke:var(--navy)}

.card{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card>b{font-size:16px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tog{display:flex;align-items:center;gap:12px;background:var(--s2);border-radius:14px;padding:12px;text-align:right;width:100%}
.tog .bx{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--s3);display:grid;place-items:center}
.tog .bx svg{width:13px;height:13px;stroke:var(--navy);stroke-width:3;fill:none;opacity:0}
.tog[aria-pressed="true"] .bx{background:var(--habit);border-color:var(--habit)}
.tog[aria-pressed="true"] .bx svg{opacity:1}
.tog span{flex:1;min-width:0}
.tog small{display:block;color:var(--muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--navy)}
.lbl{font-size:13px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--s2);font-size:20px;font-weight:700}
.stepper b{min-width:28px;text-align:center;font-size:20px}
.hint{font-size:12.5px;color:var(--muted)}
.hint.warn{color:var(--warn)}
textarea,input[type=number],input[type=text],input[type=date]{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;resize:none;min-width:0}

/* sheet */
.scrim{position:fixed;inset:0;background:#000a;z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:520px;margin:0 auto;background:var(--s1);border-radius:28px 28px 0 0;border:1px solid var(--line);border-bottom:0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow-y:auto}
.sheet.open{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:22px}
.sheet .sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.sheet h4{margin:16px 0 8px;font-size:14px;color:var(--muted);font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:right;width:100%}
.opt span{flex:1;min-width:0}
.opt b{display:block;font-size:15px}
.opt small{display:block;color:var(--muted);font-size:13px}
.opt .rd{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--s3)}
.opt[aria-pressed="true"]{border-color:var(--food);background:color-mix(in srgb,var(--food) 14%,var(--s2))}
.opt[aria-pressed="true"] .rd{border:7px solid var(--food)}
.opt:disabled{opacity:.4}
.note-k{background:#ffc85722;border-radius:12px;padding:8px 12px;font-size:13px;color:var(--habit)}
.btns{display:flex;gap:10px;margin-top:14px}
.cta{flex:1;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--navy);border-radius:16px;padding:14px;font-weight:800;font-size:16px}
.ghost{flex:none;border:1px solid var(--line);border-radius:16px;padding:14px 18px;color:var(--muted);font-weight:600}

/* menu view */
.goal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.goal div{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:12px}
.goal b{display:block;font-size:20px;font-weight:800}
.goal small{color:var(--muted);font-size:12.5px}
.msec{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:16px}
.msec h3{margin:0;font-size:18px}
.msec .k{color:var(--food);font-size:13px;font-weight:600}
.msec ol,.msec ul{margin:10px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:15px;color:#d5deeb}
.msec li small{color:var(--muted)}
.msec h4{margin:12px 0 0;font-size:14px;color:var(--muted)}

/* measures */
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mrow label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist em{font-style:normal;color:var(--muted)}
.q{display:flex;flex-direction:column;gap:6px}
.q b{font-size:15px}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;direction:ltr}
.five button{background:var(--s2);border-radius:12px;padding:10px 0;font-weight:700}
.five button[aria-pressed="true"]{background:var(--wk);color:var(--navy)}
.legend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim)}

.chart{width:100%;height:140px;direction:ltr;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--dim);stroke-width:1;stroke-dasharray:4 4}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .ln{fill:none;stroke:var(--mes);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .pt{fill:var(--bg);stroke:var(--mes);stroke-width:2}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:12px 0}

/* coach */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:13px}
.kpi b{display:block;font-size:24px;font-weight:800}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi em{font-style:normal;font-size:12.5px;font-weight:600}
.flags{display:flex;flex-direction:column;gap:8px}
.flag{display:flex;gap:10px;align-items:center;background:var(--s1);border:1px solid var(--line);border-inline-start:4px solid var(--c);border-radius:14px;padding:11px 13px;font-size:14.5px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--s1)}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:13.5px}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px}
td:first-child,th:first-child{text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.feed{display:flex;flex-direction:column}
.feed div{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
.feed em{font-style:normal;color:var(--dim);font-size:12px;display:block}
.photo-btn{position:relative;display:flex;justify-content:center;background:var(--s2);border:1px dashed var(--dim);border-radius:16px;padding:14px;font-weight:700;cursor:pointer}
.photo-btn input{position:absolute;opacity:0;width:1px;height:1px}
.photo-btn:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.ph{width:100%;max-height:240px;object-fit:cover;border-radius:16px;margin-top:10px;display:block}
.meal .th{flex:none;width:44px;height:44px;border-radius:14px;object-fit:cover}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal figure{margin:0;min-width:0}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}
.gal figcaption{font-size:11px;color:var(--muted);margin-top:3px}
.cups{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cup{aspect-ratio:3/4;border-radius:7px 7px 11px 11px;border:2px solid var(--s3);position:relative;overflow:hidden;padding:0}
.cup::after{content:"";position:absolute;inset:auto 0 0;height:0;background:var(--mes);transition:height .25s}
.cup[aria-pressed="true"]{border-color:var(--mes)}
.cup[aria-pressed="true"]::after{height:78%}
.danger{color:var(--bad);font-size:13px;text-decoration:underline;align-self:center;padding:8px}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);display:flex;justify-content:center}
.navin{display:flex;gap:2px;background:#11243eee;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:999px;padding:5px}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 14px;border-radius:999px;color:var(--muted);font-weight:600;font-size:11.5px;min-width:66px}
.nb[hidden]{display:none}
.nb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nb[aria-current="page"]{background:var(--ink);color:var(--navy)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--navy);font-weight:700;border-radius:999px;padding:10px 18px;opacity:0;transition:all .3s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:380px){.nb{min-width:56px;padding:7px 9px}.mrow{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

/* Joanne: water in liters, issue chips, workout blocks */
.avatar{border-color:var(--wk)}
.cups{grid-template-columns:repeat(12,1fr)}
.issues button[aria-pressed="true"]{background:var(--warn);color:var(--navy)}
.wo-hero{background:linear-gradient(160deg,var(--s2),var(--navy) 65%);border:1px solid var(--line);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.wo-hero .wm{position:absolute;left:-30px;bottom:-34px;width:170px;opacity:.06;pointer-events:none}
.wo-hero small{color:var(--hot);font-weight:700;font-size:12.5px;letter-spacing:.04em}
.wo-hero h2{margin:0;font-size:24px;line-height:1.15;text-wrap:balance}
.wo-hero p{margin:0;color:var(--muted);font-size:14px}
.wo-prog{height:6px;border-radius:3px;background:var(--s3);overflow:hidden;margin-top:8px}
.wo-prog i{display:block;height:100%;background:var(--hot);transition:width .4s}
.blk{background:var(--s1);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.blk.done{border-color:var(--ok)}
.blk-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.blk-h .n{flex:none;width:30px;height:30px;border-radius:10px;background:var(--s2);display:grid;place-items:center;font-weight:800;font-size:14px}
.blk.done .blk-h .n{background:var(--ok);color:var(--navy)}
.blk-h div{flex:1;min-width:0}
.blk-h b{display:block;font-size:16px}
.blk-h small{color:var(--hot);font-size:13px;font-weight:600}
.ex-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ex-row:last-of-type{border-bottom:0}
.ex-row div{flex:1;min-width:0}
.ex-row b{display:block;font-size:15px;direction:ltr;text-align:right}
.ex-row small{display:block;color:var(--muted);font-size:13px}
.ex-row a{flex:none;display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:var(--s2);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600}
.ex-row a svg{width:10px;height:10px;fill:var(--hot);transform:scaleX(-1)}
.blk-f{padding:12px 16px}
.blk-f button{width:100%;border-radius:14px;padding:12px;font-weight:700;background:var(--s2);color:var(--ink)}
.blk.done .blk-f button{background:var(--ok);color:var(--navy)}
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.feel button{background:var(--s2);border-radius:12px;padding:10px 4px;font-size:12.5px;font-weight:600;line-height:1.2}
.feel button[aria-pressed="true"]{background:var(--hot);color:var(--navy)}
.past{display:flex;flex-direction:column;gap:8px}
.wopick{display:flex;gap:8px;margin-bottom:12px}.wopick button{flex:1;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:11px 8px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.25}.wopick button[aria-pressed="true"]{background:var(--ink);color:var(--navy)}.wopick small{font-size:11px;color:var(--hot);font-weight:700}
.past button{display:flex;justify-content:space-between;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:right;width:100%}
.past button small{color:var(--muted)}
.wk-ok{color:var(--ok);font-weight:700}

/* unified app additions */
[hidden]{display:none!important}
.sets{display:flex;flex-direction:column;gap:6px;padding:0 16px 12px}
.setrow{display:grid;grid-template-columns:44px 1fr 1fr 44px;gap:8px;align-items:center}
.setrow.nokg{grid-template-columns:44px 1fr 44px}
.setrow span{font-size:12.5px;color:var(--muted)}
.setrow input{padding:9px 10px;border-radius:12px;text-align:center}
.setrow .ok{width:40px;height:40px;border-radius:12px;border:2px solid var(--s3);display:grid;place-items:center}
.setrow .ok svg{width:14px;height:14px;stroke:var(--navy);stroke-width:3;fill:none;opacity:0}
.setrow .ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.setrow .ok[aria-pressed="true"] svg{opacity:1}
.prev{font-size:12px;color:var(--habit);padding:0 16px 8px}
.painsel{display:flex;align-items:center;gap:8px;padding:0 16px 12px;font-size:13px;color:var(--muted)}
.painsel select{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;color:var(--ink)}
.go-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--hot);color:var(--navy);border-radius:16px;padding:14px;font-weight:800;font-size:16px;width:100%;margin-top:8px}
.msg{display:flex;gap:12px;background:linear-gradient(135deg,#ff6b4a26,#ff6b4a08);border:1px solid #ff6b4a40;border-radius:20px;padding:14px}
.msg .tl{flex:none;width:38px;height:38px;border-radius:50%;background:var(--hot);color:var(--navy);display:grid;place-items:center;font-weight:800}
.msg small{color:var(--hot);font-weight:700;font-size:12.5px}
.msg p{margin:2px 0 0;font-size:15px;white-space:pre-wrap}
.trc{display:flex;flex-direction:column;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:right;width:100%}
.trc .r1{display:flex;align-items:center;gap:12px}
.trc .av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-weight:800}
.trc .r1 div{flex:1;min-width:0}
.trc b{display:block;font-size:16px}
.trc small{color:var(--muted);font-size:13px}
.pill{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;color:var(--navy);background:var(--c)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats3 div{background:var(--s2);border-radius:12px;padding:8px;text-align:center}
.stats3 b{font-size:16px}
.stats3 small{display:block;font-size:11.5px}
.back{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;padding:4px 0}
.assign{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.assign select{flex:1;min-width:0;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--ink)}
.assign button{background:var(--ink);color:var(--navy);font-weight:700;border-radius:12px;padding:10px 16px}
.player{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.player.open{transform:none}
.pin{max-width:520px;width:100%;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:14px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.ptop{display:flex;align-items:center;gap:12px}
.x{width:40px;height:40px;border-radius:50%;background:var(--s1);display:grid;place-items:center;flex:none}
.x svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2.4}
.seg{flex:1;height:5px;border-radius:3px;background:var(--s3);overflow:hidden}
.seg i{display:block;height:100%;background:var(--hot)}
.stage{flex:1;min-height:220px;border-radius:26px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:20px;background:radial-gradient(circle at 70% 15%,#ff6b4a40,transparent 60%),var(--s1);border:1px solid var(--line)}
.stage small{color:var(--hot);font-weight:700}
.stage h2{margin:0;font-size:25px;line-height:1.15;direction:ltr;text-align:right}
.stage p{margin:0;color:#c9d4e4;font-size:15px}
.stage .vids{display:flex;gap:8px;flex-wrap:wrap}
.stage .vids a{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:#00000055;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600}
.stage .vids svg{width:10px;height:10px;fill:var(--hot);transform:scaleX(-1)}
.meter{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meter div{background:var(--s1);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.meter small{color:var(--muted);font-size:13px}
.meter b{font-size:26px;font-weight:800}
.meter input{font-size:22px;font-weight:800;text-align:center;padding:8px}
.big{background:var(--hot);color:var(--navy);border-radius:20px;padding:18px;font-weight:800;font-size:18px;width:100%}
.rest{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.rest[hidden],.work[hidden]{display:none!important}
.work{flex:1;display:flex;flex-direction:column;gap:12px}
.rring{width:min(68vw,240px);aspect-ratio:1;position:relative}
.rring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rring .tr{fill:none;stroke:var(--s2);stroke-width:8}
.rring .br{fill:none;stroke:var(--hot);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.rring .in{position:absolute;inset:0;display:grid;place-content:center}
.rring .in b{font-size:58px;font-weight:800;line-height:1}
.rb{display:flex;gap:10px}
.rb button{background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:12px 20px;font-weight:700}
.pnav{display:flex;justify-content:space-between}
.pnav button{color:var(--muted);font-weight:600;font-size:14px;padding:6px 2px}
.welcome{min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;text-align:center}
.welcome img{width:140px}
.welcome h1{margin:0;font-size:28px}
.welcome p{margin:0;color:var(--muted);max-width:34ch}
.pvbar{position:sticky;top:8px;z-index:30;display:flex;align-items:center;gap:10px;background:var(--hot);color:var(--navy);border-radius:16px;padding:10px 14px;margin-bottom:10px}
.pvbar span{font-size:12.5px;opacity:.8}
.pvbar button{margin-inline-start:auto;background:var(--navy);color:var(--ink);border-radius:12px;padding:8px 12px;font-weight:700}
.pvbar[hidden]{display:none!important}

/* ===== Sporty premium: one strong sans (Heebo) in heavy display weights, night navy, white type, coral for action, champagne only for rewards ===== */
:root{
  --bg:#0a1220; --navy:#0a1220; --s1:#111b2c; --s2:#18253a; --s3:#22324c; --line:#ffffff14;
  --ink:#f4f6fa; --muted:#8b97ab; --dim:#56627a;
  --hot:#ff6b4a; --gold:#e3c48f;
  --food:#8fd3b0; --habit:#e3c48f; --mes:#8cc2ff; --wk:#b7a8ff;
  --ok:#5fd39b; --warn:#f2c46b; --bad:#ff6b6b;
  --font:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-l:24px; --r-m:16px;
}
body{font-size:16px;letter-spacing:0}
.app{padding-inline:18px}
.app::before{background:radial-gradient(closest-side,#ff6b4a14,transparent 70%);height:360px;inset:-140px -40% auto}
.view{gap:20px}

/* type scale: 34 / 24 / 18 / 15 / 13 */
.hello b,.sh h2,.wo-hero h2,.welcome h1,.authin h1,.ring .in b,.kpi b,.streak b,.stage h2,.stats3 b,.meter b{font-family:var(--font);font-weight:800;letter-spacing:-.01em}
.sh{align-items:center}
.sh h2{font-size:20px}
.sh span{font-size:13px;color:var(--muted)}

/* header */
.brand{gap:8px;min-height:36px}
.brand img{height:18px}
.brand b{font-weight:700;letter-spacing:.32em;font-size:10.5px;color:var(--muted)}
.save{border:0;padding:0;font-size:12px;color:var(--dim)}
.save.ok{color:var(--dim)}
.logout{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--muted)}

.hello{gap:14px}
.avatar{width:52px;height:52px;background:var(--s2);border:2px solid var(--hot);color:var(--ink);font-weight:800;font-size:20px}
.hello small{font-size:13px;color:var(--muted)}
.hello b{font-size:30px;line-height:1.05}

/* surfaces */
.card,.meal,.blk,.trc,.past button{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:none}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-m)}

/* day strip */
.strip{gap:6px}
.dy{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-m);padding:9px 0 7px}
.dy b{font-size:17px;font-weight:700}
.dy small{font-size:11px}
.dy.has i{background:var(--hot)}
.dy[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dy[aria-pressed="true"] small{color:#5d6a80}

/* hero */
.sum{background:linear-gradient(150deg,#16233a,#0f1828 70%);border:1px solid var(--line);border-radius:28px;padding:20px;gap:18px}
.sum .wm{opacity:.04;width:190px}
.ring{width:116px;height:116px}
.ring .tr{stroke:#ffffff10;stroke-width:9}
.ring .br{stroke:var(--hot);stroke-width:9}
.ring .in b{font-size:30px}
.ring .in small{font-size:11.5px}
.facts{gap:9px}
.fact{font-size:14.5px;font-weight:500}
.fact i{width:7px;height:7px}
.fact span{font-weight:700;color:var(--ink);font-size:14px}
.streak{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:#ffffff08;color:var(--dim);justify-self:start}
.streak svg{width:18px;height:18px;fill:currentColor}
.streak b{font-size:20px;line-height:1;color:inherit}
.streak span{font-size:13.5px;font-weight:500}
.streak.on{color:var(--gold);background:#e3c48f14}
.sum .cap{font-size:12px;color:var(--dim)}

/* meals */
.meal{padding:14px;gap:14px}
.meal .ic{width:44px;height:44px;border-radius:14px;background:var(--s2);border:0}
.meal .ic svg{stroke:var(--ink);stroke-width:1.8}
.meal .tx b{font-size:16px;font-weight:700}
.meal.done{border-color:#5fd39b33}
.meal.done .ic{background:#5fd39b1f}
.meal.done .ic svg{stroke:var(--ok)}

/* buttons */
.cta,.big{background:var(--ink);color:var(--bg);font-weight:800}
.go-btn{background:var(--hot);color:#1d0e09;font-weight:800}

/* weekly bars */
.wkbars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px;padding-top:4px}
.wb{display:flex;flex-direction:column;align-items:center;gap:7px;height:100%}
.wb .col{flex:1;width:100%;max-width:26px;border-radius:9px;background:#ffffff08;display:flex;align-items:flex-end;overflow:hidden}
.wb .col i{display:block;width:100%;border-radius:9px;background:#dfe5ee;transition:height .5s}
.wb.now .col i{background:var(--hot)}
.wb .mk{display:flex;gap:3px;height:6px}
.wb .mk b,.wklegend i{display:inline-block;width:6px;height:6px;border-radius:50%}
.wb .mk .o,.wklegend .o{background:var(--hot)}
.wb .mk .d,.wklegend .d{background:var(--mes)}
.wklegend .bar{width:10px;border-radius:3px;background:#dfe5ee}
.wb small{font-size:11.5px;color:var(--muted)}
.wb.now small{color:var(--ink);font-weight:700}
.wklegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.wklegend span{display:flex;align-items:center;gap:6px}

/* achievements: one swipeable row of medals */
.badges{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-18px;padding:2px 18px 6px;scrollbar-width:none}
.badges::-webkit-scrollbar{display:none}
.bdg{flex:none;width:118px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:16px 8px 14px;border-radius:var(--r-l);background:var(--s1);border:1px solid var(--line);color:var(--dim)}
.bdg .md{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#ffffff08;margin-bottom:6px}
.bdg .md svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}
.bdg b{font-size:13.5px;font-weight:700;line-height:1.2}
.bdg small{font-size:11.5px;line-height:1.3}
.bdg.ok{color:var(--ink);border-color:#e3c48f3d}
.bdg.ok .md{background:radial-gradient(circle at 35% 30%,#f6e2b8,#c9a46a);color:#2a1f0e}
.bdg.ok .md svg{fill:#2a1f0e;stroke:#2a1f0e}
.bdg.ok small{color:var(--muted)}

/* progress photos */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:6px}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r-m)}
.cmp figcaption{font-size:12px;color:var(--muted);text-align:center}
.photo-in{display:flex;align-items:center;justify-content:center;border-radius:var(--r-m);padding:13px;cursor:pointer}

.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:200}

/* nav */
.navin{background:#111b2cf0;border:1px solid var(--line)}
.nb{font-weight:600}
.nb[aria-current="page"]{background:var(--hot);color:#1d0e09}
.nb[aria-current="page"] svg{stroke:#1d0e09}

/* reminders: one compact row */
.remind{padding:14px 16px}
.remind .rr{display:flex;align-items:center;gap:12px}
.remind .rr div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.remind small{color:var(--muted);font-size:13px}
.remind .cta{flex:none;padding:10px 18px;border-radius:999px}
.remst{color:var(--ok);font-weight:600;font-size:14px}

.ask textarea{min-height:120px;font-size:16px;line-height:1.5}
.askb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.askb button{border-radius:var(--r-m);padding:13px;font-weight:800}
.askb .ghost{background:var(--s2);color:var(--ink);border:1px solid var(--line)}
.reqs{display:flex;flex-direction:column;gap:10px}
.req{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-l);padding:14px;display:flex;flex-direction:column;gap:8px}
.req .rh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.req .rh small{color:var(--dim);font-size:12px}
.req p{margin:0;white-space:pre-wrap;font-size:15px}
.rep{background:var(--s2);border-radius:var(--r-m);padding:10px 12px;font-size:14px;white-space:pre-wrap;color:#d6dce6}
.rep b{display:block;font-size:12px;color:var(--gold);margin-bottom:2px}
.pvbar{background:var(--hot)}

.danger{border-color:#ff6b6b33}
.danger .del{color:var(--bad);border-color:#ff6b6b55}

/* brand: Playground x Tal Lipshtat */
.brand{gap:10px;align-items:center}
.brand img{height:26px}
.brand .bt{display:flex;flex-direction:column;line-height:1.15}
.brand .bt b{font-size:11px;letter-spacing:.34em;color:var(--ink);font-weight:800}
.brand .bt small{font-size:11.5px;color:var(--hot);font-weight:600;letter-spacing:.01em}
.app::after{content:"";position:fixed;left:-120px;bottom:-60px;width:420px;height:230px;background:url(pg-logo.png) no-repeat center/contain;opacity:.035;pointer-events:none;z-index:0}
.sum .wm{opacity:.07;width:230px;left:-40px;bottom:-46px}
.msg{background:linear-gradient(135deg,#ff6b4a2b,#ff6b4a0a);border-color:#ff6b4a4d}
.msg .tl{background:var(--bg);border:1.5px solid var(--hot);overflow:hidden}
.msg .tl img{width:24px;height:auto}
.msg small{letter-spacing:.01em}
.sig{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:var(--dim);padding-bottom:6px}
.sig img{width:46px;opacity:.55;margin-bottom:4px}
.sig b{font-size:10.5px;letter-spacing:.34em;color:var(--muted);font-weight:800}
.sig span{font-size:12px}
.aby{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:-4px}
.aby b{font-size:11px;letter-spacing:.36em;color:var(--ink);font-weight:800}
.aby span{font-size:13px;color:var(--hot);font-weight:600}
.authin img{width:170px}
.authin h1{margin-top:10px}
.authin input{background:var(--s1);border:1px solid var(--line);color:var(--ink)}
.authin input:focus{border-color:var(--hot);outline:none}

/* iPhone home-screen app: keep content below the status bar (clock, battery) */
.app{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.auth{padding-top:calc(24px + env(safe-area-inset-top,0px))}
.pvbar{top:calc(8px + env(safe-area-inset-top,0px))}

.fl2{padding:6px 6px 6px 13px;gap:8px}
.fl2 .ft{flex:1;text-align:right;padding:5px 0;font-size:14.5px;color:var(--ink)}
.fl2 .ack{flex:none;width:38px;height:38px;border-radius:12px;background:var(--s2);border:1px solid var(--line);color:var(--ok);font-weight:800;font-size:16px}
.fl2 .ack:active{background:var(--ok);color:var(--bg)}

/* food log */
#fq,#rn{width:100%;padding:13px 14px;border-radius:var(--r-m);background:var(--s1);border:1px solid var(--line);color:var(--ink);font-size:16px;margin:6px 0}
.flist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.fi{display:flex;flex-direction:column;align-items:flex-start;text-align:right;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.fi b{font-size:15px}.fi small{color:var(--muted);font-size:12.5px}
.pick{margin-top:8px}.pick input,.ownf input,.sheet .lbl input{width:100%;padding:11px;border-radius:12px;background:var(--s2);border:1px solid var(--line);color:var(--ink);font-size:16px}
.own{margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:4px 12px}
.own summary{padding:8px 0;font-weight:600;color:var(--muted)}
.ownf{display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
.ings{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.ing{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.ing span{flex:1;display:flex;flex-direction:column}.ing small{color:var(--muted);font-size:12.5px}
.ing button{width:32px;height:32px;border-radius:10px;background:var(--s2);color:var(--muted);font-size:18px}
.tot{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;background:var(--s1);border-radius:14px;padding:10px 12px;font-size:13px;margin:8px 0}
.tot b{color:var(--gold)}.tot span{color:var(--ink)}
.sheet .back{margin-bottom:4px}
/* multi-pick groups (build-a-plate veggies) */
.opts.multi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.multi .opt{padding:10px 12px;min-height:0}
.opts.multi .opt small{font-size:11px}
.opts.multi .opt .rd{border-radius:6px;width:20px;height:20px}
.opts.multi .opt[aria-pressed="true"] .rd{border:2px solid var(--food);background:var(--food);box-shadow:inset 0 0 0 3px var(--s2)}
h4 .mh{font-weight:500;opacity:.6;font-size:12px}
.plate{position:sticky;bottom:0;z-index:2;background:var(--s2)!important;border:1px solid var(--gold);box-shadow:0 -8px 24px rgba(0,0,0,.45)}
.plate b{margin-inline-end:6px}
/* recipe decoder */
#rtx{width:100%;margin:10px 0;font:inherit;line-height:1.6}
.rmsg{line-height:1.6}.rmsg b{color:var(--hot)}
.ing .gin{display:flex;align-items:center;gap:4px;font-size:12px;opacity:.85}
.ing .gin input{width:64px;padding:6px 8px;text-align:center;font:inherit;font-size:14px}
.recbtn{display:flex;flex-direction:column;gap:4px;width:100%;text-align:start;border:1px solid var(--gold);cursor:pointer;color:inherit;font:inherit}
.recbtn b{color:var(--gold);font-size:17px}.recbtn small{opacity:.75}
/* coach recipe library */
.crb input,.crb textarea{width:100%;margin-top:10px;font:inherit;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:inherit}
.lrec .lrh{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}.lrec .lrh small{opacity:.7}
.lrec .chips button{font-size:13px;padding:7px 12px}
.lrec .fits{margin-top:12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.lrec .fits div{display:flex;gap:8px;flex-wrap:wrap}.lrec .fits b{color:var(--gold)}.lrec .fits span{opacity:.8}
.lrec .askb{margin-top:12px}
.crb .imp{margin-top:16px;padding:14px;border:1px dashed var(--gold);border-radius:16px;display:flex;flex-direction:column;gap:8px}
.crb .imp>b{color:var(--gold)}.crb .imp .chips button{font-size:13px;padding:7px 12px}.crb .imp textarea{margin-top:0}
.imp-note{line-height:1.7}.imp-note b{color:var(--ink)}
.crb .asg{margin-top:14px;display:flex;flex-direction:column;gap:8px}.crb .asg .chips button{font-size:13px;padding:7px 12px}
/* pick-N workout blocks */
.pickb{display:inline-block;margin-inline-end:8px;margin-bottom:4px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--s2);font-size:12px;font-weight:700;color:var(--muted);vertical-align:middle}
.pickb[aria-pressed="true"]{background:var(--hot);border-color:var(--hot);color:#fff}
.ex-row.unpicked{opacity:.5}
.pausebn{border:1px solid var(--gold);display:flex;flex-direction:column;gap:4px}.pausebn b{color:var(--gold)}.pausebn span{opacity:.8}

<script>

async function shrink(file){const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  let max=900,q=.72,out="";for(let t=0;t<6;t++){const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    out=c.toDataURL("image/jpeg",q);if(out.length<170000)break;max*=.8;q=Math.max(.4,q-.08)}
  URL.revokeObjectURL(url);return out}

const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;let vcOn=false,vcRec=null,vcText="",vcBusy=false;
function vcToggle(){if(!SRC)return;if(vcOn){try{vcRec.stop()}catch(e){}return}
  vcRec=new SRC();vcRec.lang="he-IL";vcRec.continuous=true;vcRec.interimResults=true;const base=vcText?vcText+" ":"";

async function vcParse(exs){const txt=(vcText||"").trim();if(!txt){toast("אין טקסט לפענח");return}if(vcBusy)return;vcBusy=true;const b=$("vcGo");if(b)b.textContent="מפענח…";
  const res=window.pgAI&&window.pgAI.report?await window.pgAI.report({text:txt,people:DR.people.map(p=>p.name),exercises:exs,areas:AREAS,mistakes:mistakesFor(exs)}):null;vcBusy=false;
  if(!res||!Array.isArray(res.people)){toast("לא הצלחתי לפענח, נסו שוב");render();return}
  res.people.forEach(rp=>{const nm=String(rp.name||"").trim();if(!nm)return;let p=DR.people.find(x=>x.name===nm)||DR.people.find(x=>x.name.includes(nm)||nm.includes(x.name.split(" ")[0]));
    if(!p){addPersonQuiet(nm);p=DR.people[DR.people.length-1]}
    p.tags=[...new Set([...(p.tags||[]),...(rp.tags||[]).filter(t=>TL[t])])];
    if(rp.pn&&(rp.pn.area||rp.pn.lvl)){p.pn={...(p.pn||{}),...rp.pn};if(!p.tags.includes("pain"))p.tags.push("pain")}
    if(rp.lx)Object.entries(rp.lx).forEach(([x,v])=>{const k=exs.find(e=>e===x)||exs.find(e=>e.toLowerCase().includes(String(x).toLowerCase().slice(0,12)))||x;p.lx=p.lx||{};p.lx[k]={...(p.lx[k]||{}),...v}});
    if(rp.err)p.err=[...new Set([...(p.err||[]),...rp.err])];if(rp.score)p.score=rp.score;if(rp.note)p.note=[p.note,rp.note].filter(Boolean).join(" · ")});
  if(res.note)DR.note=[DR.note,res.note].filter(Boolean).join(" · ");if(res.tal)DR.tal=[DR.tal,res.tal].filter(Boolean).join(" · ");
  vcText="";draftSave();render();toast("מולא מההקלטה. עברו ושלחו")}

    ${(x.x||[]).map(e=>{n++;const k=bfSel+"|"+n,op=bfAll||BOPEN.has(k),d=dn.has(n);return `<article class="bf-ex${op?" open":""}${d?" done":""}">
      <button class="bf-exh" type="button" data-bex="${esc(k)}"><span class="tile">${d?"✓":String(n).padStart(2,"0")}</span><span class="nm">${e.n}</span><span class="chev">${op?"▲":"▼"}</span></button>
      ${op?`<div class="bf-exb"><div class="bf-vids">${(e.v||[]).map(([l,id])=>`<a href="https://www.youtube.com/watch?v=${esc(id)}" target="_blank" rel="noopener"><span>▶</span>${esc(l)}</a>`).join("")}</div>
        <div class="bf-cue"><b>קיו</b>${e.c||""}</div><div class="bf-err"><b>הטעות</b>${e.e||""}</div>
        <div class="bf-tabs" data-bt="${n}">${[["p","הריון"],["i","פציעות"],["t","למאמן"]].filter(([q])=>e[q]).map(([q,l],j)=>`<button type="button" data-btab="${q}" aria-pressed="${j===0}">${l}</button>`).join("")}</div>
        ${[["p"],["i"],["t"]].filter(([q])=>e[q]).map(([q],j)=>`<div class="bf-pane" data-bpane="${q}"${j?" hidden":""}>${e[q]}</div>`).join("")}
        <button class="bf-mark" type="button" data-bdone="${n}">${d?"✓ סומן":"✓ עברתי על התרגיל"}</button></div>`:""}</article>`}).join("")}
  </section>`}).join("")}
  <div class="sh"><h2>לוגיסטיקה</h2></div>
  ${(b.logi||[]).map(([h,li])=>`<div class="card bf-lg"><b>${esc(h)}</b><ul>${li.map(t=>`<li>${t}</li>`).join("")}</ul></div>`).join("")}
  </div>`;
  bfDraw()}
function bfDraw(){const T=$("bfT");if(!T)return;T.textContent=mmss(bfT).padStart(5,"0");const m=bfT/60,b=BRF[bfSel]||{},tl=b.tl||[],end=tl.length?tl[tl.length-1][3]:50;let cur=null;
  document.querySelectorAll("#bfTl i").forEach((s,i)=>{const a=+s.dataset.s,e=+s.dataset.e,on=m>=a&&m<e;s.classList.toggle("cur",on);s.classList.toggle("past",m>=e);if(on)cur=tl[i]});
  document.querySelectorAll(".bf-leg button").forEach(x=>x.classList.toggle("cur",m>=+x.dataset.s&&m<+x.dataset.e));
  const mk=$("bfMk");if(mk)mk.style.right=Math.min(100,bfT/(end*60)*100)+"%";
  $("bfNow").textContent=bfT===0?"לפני השיעור":cur?`${cur[1]} · נשארו ${mmss(cur[3]*60-bfT)}`:bfT>=end*60?"סוף השיעור":"מעבר"}
function bfRestOpen(opts,nx){let o=$("bfRs");if(!o){o=document.createElement("div");o.id="bfRs";o.className="bf-rs";document.body.appendChild(o);
    o.addEventListener("click",ev=>{const t=ev.target;if(t===o||t.closest("[data-rsx]")){clearInterval(rsRun);rsRun=null;o.classList.remove("open");return}
      if(t.closest("[data-rsp]")){rsT+=15;rsTot=Math.max(rsTot,rsT);rsDraw();return}if(t.closest("[data-rspa]")){rsPause=!rsPause;t.textContent=rsPause?"המשך":"השהה";return}
      const op=t.closest("[data-rso]");if(op){o.querySelectorAll("[data-rso]").forEach(x=>x.setAttribute("aria-pressed",x===op));rsStart(+op.dataset.rso)}})}
  const C=2*Math.PI*90;o.innerHTML=`<div class="bf-sheet"><span class="grab"></span><small>מנוחה · הבא: ${esc(nx)}</small>
    <div class="bf-rr"><svg viewBox="0 0 200 200"><circle class="tr" cx="100" cy="100" r="90"/><circle class="br" id="rsBar" cx="100" cy="100" r="90" style="stroke-dasharray:${C}"/></svg><div class="in"><b id="rsT">0:00</b><small id="rsS">נותרו</small></div></div>
    <div class="chips">${opts.map((x,i)=>`<button type="button" data-rso="${x}" aria-pressed="${i===0}">${mmss(x)}</button>`).join("")}</div>
    <div class="chips"><button type="button" data-rsp>+15 שנ׳</button><button type="button" data-rspa>השהה</button><button type="button" data-rsx>סגור</button></div></div>`;
  o.classList.add("open");rsStart(opts[0])}
function rsDraw(){const C=2*Math.PI*90,b=$("rsBar");if(!b)return;$("rsT").textContent=mmss(rsT);b.style.strokeDashoffset=C*(1-(rsTot?rsT/rsTot:0))}
function rsStart(s){rsTot=s;rsT=s;rsPause=false;clearInterval(rsRun);rsDraw();$("rsS").textContent="נותרו";
  rsRun=setInterval(()=>{if(rsPause)return;rsT--;rsDraw();if(rsT<=0){clearInterval(rsRun);rsRun=null;$("rsS").textContent="יוצאים לסבב!";try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}},1000)}
$("v-brief").addEventListener("click",ev=>{const t=ev.target;
  const sd=t.closest("[data-bseld]");if(sd){bfSel=Object.keys(BRF).sort().find(id=>BRF[id].date===sd.dataset.bseld);render();return}
  const s=t.closest("[data-bsel]");if(s){bfSel=s.dataset.bsel;render();return}
  if(t.closest("[data-ball]")){bfAll=!bfAll;if(!bfAll)BOPEN.clear();render();return}
  const ex=t.closest("[data-bex]");if(ex){const k=ex.dataset.bex;if(bfAll){bfAll=false;BOPEN.clear()}BOPEN.has(k)?BOPEN.delete(k):BOPEN.add(k);render();return}
  const tb=t.closest("[data-btab]");if(tb){const art=tb.closest(".bf-ex");art.querySelectorAll("[data-btab]").forEach(x=>x.setAttribute("aria-pressed",x===tb));art.querySelectorAll("[data-bpane]").forEach(p=>p.hidden=p.dataset.bpane!==tb.dataset.btab);return}
  const dn=t.closest("[data-bdone]");if(dn){const i=+dn.dataset.bdone,S=BDONE[bfSel]=BDONE[bfSel]||new Set();if(S.has(i))S.delete(i);else{S.add(i);BOPEN.delete(bfSel+"|"+i)}bdSave();render();
    const tot=(BRF[bfSel].blocks||[]).reduce((a,x)=>a+(x.x||[]).length,0);if(S.has(i))toast(S.size===tot?"מוכנים לשיעור 🔥":`${S.size} מתוך ${tot}`);return}
  if(t.closest("[data-bclk]")){if(bfRun){clearInterval(bfRun);bfRun=null}else{bfRun=setInterval(()=>{bfT++;if(tab==="brief")bfDraw()},1000);toast("השיעור התחיל ⏱")}const b=t.closest("[data-bclk]");b.textContent=bfRun?"❚❚":"▶";return}
  if(t.closest("[data-brst]")){bfT=0;bfDraw();return}
  const g=t.closest("[data-bgo]");if(g){const el=$("bf-"+g.dataset.bgo);if(el)el.scrollIntoView({behavior:"smooth"});return}
  const r=t.closest("[data-brest]");if(r){bfRestOpen(r.dataset.brest.split(",").map(Number),r.dataset.bnx);return}});

/* ---------- day program (sheet view) ---------- */
let pgSel=null;
function dayPick(store,sel,attr){const ids=Object.keys(store).sort(),days=[...new Set(ids.map(id=>store[id].date))].sort(),cur=store[sel]?store[sel].date:null,types=ids.filter(id=>store[id].date===cur);
  return `<div class="chips dpk">${days.map(d=>`<button type="button" data-${attr}d="${d}" aria-pressed="${d===cur}">${d===TODAY?"היום":d===addDays(TODAY,1)?"מחר":esc(fmt(d))}</button>`).join("")}</div>${types.length>1?`<div class="chips">${types.map(id=>`<button type="button" data-${attr}="${esc(id)}" aria-pressed="${id===sel}">${esc(typeOf(id))}</button>`).join("")}</div>`:""}`}
const pgCol=n=>/mobil|מוביליטי/i.test(n)?"var(--pA)":/core|קור/i.test(n)?"var(--pB)":/metcon|מטקון|chipper|buy/i.test(n)?"var(--pD)":"var(--pC)";
function renderProg(){const v=$("v-prog");
  if(!stLoaded){v.innerHTML=`<div class="card"><div class="empty">טוען…</div></div>`;loadStudio();return}
  const ids=Object.keys(WD).sort();
  if(!ids.length){v.innerHTML=`<div class="hello"><span class="avatar">ת</span><div><small>תכנית האימון</small><b>אין תכנית עדיין</b></div></div><div class="card"><div class="empty">התכנית של השיעור הבא תופיע כאן ברגע שהיא עולה.</div></div>`;return}
  if(!pgSel||!WD[pgSel])pgSel=ids.find(id=>WD[id].date===TODAY)||ids.find(id=>WD[id].date>TODAY)||ids[ids.length-1];
  const w=WD[pgSel];
  v.innerHTML=`<div class="pg">
  ${dayPick(WD,pgSel,"pgs")}
  <div class="pg-hero"><small>${esc(w.tag||typeOf(pgSel))} · ${esc(fmt(w.date))}</small><h1>${esc(w.title||"")}</h1></div>
  ${(w.blocks||[]).map(b=>{const nm=String(b.name||"").split("·").pop().trim();let k=0;return `<div class="pg-blk" style="--c:${pgCol(b.name||"")}">
    <div class="pg-bh"><b>${esc(nm)}</b></div>${b.format?`<div class="pg-fmt">${esc(b.format)}</div>`:""}
    ${(b.items||[]).map(it=>{k++;const extra=[it.sets&&!/round/i.test(b.format||"")?it.sets+" sets":"",it.reps&&!String(it.n||"").includes(String(it.reps).split(" ")[0])?it.reps:""].filter(Boolean).join(" · ");return `<div class="pg-ln"><span>${esc(it.n)}${extra?`<small>${esc(extra)}</small>`:""}</span><i>${k}</i></div>`}).join("")}
    ${b.rest?`<span class="pg-rest">Rest ${mmss(+b.rest)}</span>`:""}</div>`}).join("")}
  </div>`}
$("v-prog").addEventListener("click",ev=>{const d=ev.target.closest("[data-pgsd]");if(d){pgSel=Object.keys(WD).sort().find(id=>WD[id].date===d.dataset.pgsd);render();return}const s=ev.target.closest("[data-pgs]");if(s){pgSel=s.dataset.pgs;render()}});

/* ===== owner preview ===== */
const NB=t=>document.querySelector(`.nb[data-tab="${t}"]`);
function fill(store,src){Object.keys(store).forEach(k=>delete store[k]);Object.assign(store,JSON.parse(JSON.stringify(src||{})))}
async function enterPreview(id){const c=C[id];if(!c||!c.prof)return;preview=id;uid=id;prof=c.prof;
  fill(W,c.wo);fill(MSG,c.msgs);fill(body,c.body||{});fill(days,c.days);fill(weigh,c.weigh);fill(weekly,c.weekly);fill(wlog,c.wlog);fill(photos,{});
  liveU.forEach(f=>{try{f()}catch(e){}});liveU=subscribeAll();
  ["today","workout","menu","measure"].forEach(t=>NB(t).hidden=false);NB("coach").hidden=true;NB("claude").hidden=true;NB("class").hidden=true;NB("brief").hidden=true;NB("prog").hidden=true;
  const b=$("pvbar");b.querySelector("b").textContent=`שיקוף חי · ${nameOf(id)}`;b.hidden=false;sel=TODAY;woSel=null;go("today")}
function exitPreview(){if(isCoach){NB("class").hidden=false;NB("brief").hidden=false;NB("prog").hidden=false}liveU.forEach(f=>{try{f()}catch(e){}});liveU=[];preview=null;uid=ownerUid;prof=null;[W,MSG,days,weigh,weekly,wlog,photos,body].forEach(s=>fill(s,{}));
  $("pvbar").hidden=true;["today","workout","menu","measure"].forEach(t=>NB(t).hidden=true);NB("coach").hidden=false;NB("claude").hidden=false;go("coach")}
$("pvbar").querySelector("button").onclick=exitPreview;

function subscribeAll(){const U=[],k=f=>{if(typeof f==="function")U.push(f)};
  k(db.doc(`p/${uid}`).onSnapshot(s=>{prof=s.exists?s.data():null;if(prof){$("nav").hidden=false;if($("v-today").hidden&&tab==="today")$("v-today").hidden=false}render()},()=>{}));
  k(db.collection(`p/${uid}/workouts`).onSnapshot(s=>{Object.keys(W).forEach(k=>delete W[k]);s.docs.forEach(d=>W[d.id]=d.data());if(sheetMeal===null&&!PL)render()},()=>{}));
  k(db.collection(`p/${uid}/msgs`).onSnapshot(s=>{Object.keys(MSG).forEach(k=>delete MSG[k]);s.docs.forEach(d=>MSG[d.id]=d.data());if(sheetMeal===null)render()},()=>{}));
  const sub=(col,store)=>k(db.collection(tp(col)).onSnapshot(s=>{const seen=new Set();
    s.docs.forEach(d=>{seen.add(d.id);if(!busy(tp(col,d.id)))store[d.id]=d.data()});
    Object.keys(store).forEach(k=>{if(!seen.has(k)&&!busy(tp(col,k)))delete store[k]});
    if(sheetMeal!==null||PL)return;render()},()=>setSave("החיבור נותק","err")));
  sub("days",days);sub("weigh",weigh);sub("weekly",weekly);sub("wlog",wlog);sub("recipes",recipes);
  k(db.collection(tp("body")).onSnapshot(s=>{Object.keys(body).forEach(k=>delete body[k]);s.docs.forEach(d=>{const v=d.data();if(v&&v.img)body[d.id]=v.img});if(sheetMeal===null&&!PL)render()},()=>{}));
  k(db.collection(tp("photos")).where("d",">=",addDays(TODAY,-13)).onSnapshot(s=>{s.docs.forEach(d=>{if(!busy(tp("photos",d.id))){const v=d.data();if(v&&v.img)photos[d.id]=v.img}});if(sheetMeal===null&&!PL)render()},()=>{}));
  return U}
let liveU=[];
/* ===== boot ===== */
(async()=>{
  const use=window.claude&&window.claude.use?n=>window.claude.use(n):()=>Promise.resolve(null);
  [db,user]=await Promise.all([use("db"),use("user")]);
  if(user){isOwner=await user.isOwner();uid=await user.id();ownerUid=uid;try{isCoach=await user.isCoach();if(isCoach)coachName=await user.coachName()}catch(e){}}
  booted=true;
  if(!db){setSave("לא מחובר","err");renderWelcome();return}
  if(isOwner){$("nav").hidden=false;document.querySelector('.nb[data-tab="coach"]').hidden=false;document.querySelector('.nb[data-tab="claude"]').hidden=false;
    db.collection("req").onSnapshot(s=>{Object.keys(REQ).forEach(k=>delete REQ[k]);s.docs.forEach(d=>REQ[d.id]=d.data());if(tab==="claude"&&!typing())render()},()=>{});
    if(isCoach){NB("class").hidden=false;NB("brief").hidden=false;NB("prog").hidden=false}
    ["today","workout","menu","measure"].forEach(t=>document.querySelector(`.nb[data-tab="${t}"]`).hidden=true);if(!(isCoach&&openRep()))go("coach");return}
  if(isCoach&&uid){$("nav").hidden=false;["today","workout","menu","measure"].forEach(t=>NB(t).hidden=true);NB("class").hidden=false;NB("brief").hidden=false;NB("prog").hidden=false;setSave("מחובר ✓","ok");if(!openRep())go("brief");return}
  if(!uid){setSave("לא מחובר","err");renderWelcome();return}
  setSave("מחובר ✓","ok");
  const cw=await user.can("data.write");if(cw===false)readOnly=true;
  try{const me=await db.doc(`t/${uid}`).get();if(!me.exists&&!readOnly)await db.doc(`t/${uid}`).set({joined:TODAY,seen:TODAY});else if(me.exists&&(me.data()||{}).seen!==TODAY&&!readOnly)await db.doc(`t/${uid}`).update({seen:TODAY})}catch(e){if(e&&e.code==="invalid_argument"){readOnly=true;showBanner("השמירה נכשלה. נסו להתנתק ולהתחבר שוב, ואם זה חוזר ספרו לטל.")}}
  subscribeAll();
  go("today");
})();
</script>
