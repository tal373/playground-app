<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2150">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../../icon-192.png">
<title>אזור רואה חשבון · פלייגראונד</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Assistant:wght@400;500;600;700&display=swap">
<style>
/* Accountant area: read-only view of one bi-monthly VAT period — totals, VAT calculation, tax invoices, all expenses, income — plus one-click ZIP of every document with an Excel summary. */
:root{
  --bg:#f2f4f8;--surface:#fff;--surface2:#edf0f6;--ink:#0f1b33;--muted:#5d6984;--line:#dce1eb;
  --navy:#0d2150;--navy2:#183670;--rail-ink:#c9d4ec;--accent:#2f6fe4;--accent-soft:#e2ebfd;
  --ok:#13866c;--ok-soft:#ddf3eb;--warn:#ad6800;--warn-soft:#fff0d6;--bad:#c23a3a;--bad-soft:#fde5e5;--mute-soft:#eaedf3;
  --font-d:"Rubik","Assistant",system-ui,sans-serif;--font-b:"Assistant","Rubik",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1122;--surface:#111b31;--surface2:#16223c;--ink:#e7ecf6;--muted:#98a4be;--line:#25324f;--navy:#071229;--navy2:#0f2552;--rail-ink:#a9b8da;--accent:#6b9cff;--accent-soft:#1a2c55;--ok:#3fc29d;--ok-soft:#123a31;--warn:#f0a93b;--warn-soft:#3a2c12;--bad:#ff7b7b;--bad-soft:#401c1f;--mute-soft:#1c2843;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1122;--surface:#111b31;--surface2:#16223c;--ink:#e7ecf6;--muted:#98a4be;--line:#25324f;--navy:#071229;--navy2:#0f2552;--rail-ink:#a9b8da;--accent:#6b9cff;--accent-soft:#1a2c55;--ok:#3fc29d;--ok-soft:#123a31;--warn:#f0a93b;--warn-soft:#3a2c12;--bad:#ff7b7b;--bad-soft:#401c1f;--mute-soft:#1c2843;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;direction:rtl}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-d)}
.hdr{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;padding:18px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px))}
.hdr .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hdr h1{font:700 clamp(20px,3vw,24px) var(--font-d);margin:0}
.hdr p{margin:2px 0 0;color:var(--rail-ink);font-size:13.5px}
.hdr .who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--rail-ink)}
.hdr a,.hdr button{font:500 12.5px var(--font-b);color:var(--rail-ink);background:none;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:4px 10px;cursor:pointer;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.periods{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.periods button{font:600 14px var(--font-d);border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:7px;cursor:pointer}
.periods button[aria-pressed="true"]{background:var(--navy);color:#fff}
.btn{font:600 14px var(--font-b);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[disabled]{opacity:.6;cursor:progress}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;gap:14px;margin-bottom:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h2{font:600 17px var(--font-d);margin:0 0 2px}
.card .cap{color:var(--muted);font-size:13px;margin:0 0 12px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .l{color:var(--muted);font-size:13px;font-weight:600}
.kpi .v{font:600 24px var(--font-d);font-variant-numeric:tabular-nums}
.kpi .h{color:var(--muted);font-size:12.5px}
.kpi.hl{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.hl .l,.kpi.hl .h{color:var(--rail-ink)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:right;font:600 12.5px var(--font-d);color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--surface2)}
td.amt,th.amt{text-align:left;white-space:nowrap}
td .d{color:var(--muted);font-size:12.5px;margin-top:2px}
.chip{display:inline-flex;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-bad{background:var(--bad-soft);color:var(--bad)}.c-na{background:var(--mute-soft);color:var(--muted)}.c-warn{background:var(--warn-soft);color:var(--warn)}
.files{display:flex;flex-direction:column;gap:3px}
.files a{color:var(--accent);font-size:12.5px;text-decoration:none;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc{display:grid;gap:6px;font-size:15px}
.calc div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.calc div:last-child{border-bottom:0;font:700 18px var(--font-d)}
.note{color:var(--muted);font-size:12.5px;margin-top:10px}
.prog{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{font:600 13px var(--font-b);border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:var(--navy)}
.gate[hidden]{display:none}
.gbox{width:min(390px,100%);background:var(--surface);color:var(--ink);border-radius:16px;padding:26px 22px;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.gbox label{display:grid;gap:6px;font-size:14px;color:var(--muted)}
.gbox input{font:15px var(--font-b);padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
.glogo{font:700 21px var(--font-d)}
.gsub{margin:0;color:var(--muted);font-size:14px}
.gerr{margin:0;min-height:1.2em;color:var(--bad);font-size:14px}
.glink{background:none;border:0;color:var(--accent);font:600 13.5px var(--font-b);cursor:pointer;padding:0;text-align:start}
@media (max-width:640px){.kpi .v{font-size:21px}.periods button{padding:6px 10px;font-size:13px}}
</style>
</head>
<body>
<header class="hdr"><div class="in">
  <div><h1>אזור רואה חשבון</h1><p>פלייגראונד סטודיו · עוסק מורשה 558563573</p></div>
  <div class="who" id="who"></div>
</div></header>
<main class="wrap" id="main"><div class="empty">טוען…</div></main>

<div id="gate" class="gate" hidden>
  <form class="gbox" id="gForm" autocomplete="on">
    <div class="glogo">אזור רואה חשבון · פלייגראונד</div>
    <p class="gsub" id="gSub">כניסה עם המייל והסיסמה שלך</p>
    <label>מייל<input id="gEm" type="email" autocomplete="username" required></label>
    <label>סיסמה<input id="gPw" type="password" autocomplete="current-password" required minlength="8"></label>
    <button class="btn pri" id="gGo" type="submit">כניסה</button>
    <button class="glink" id="gNew" type="button">כניסה ראשונה? יצירת סיסמה</button>
    <button class="glink" id="gForgot" type="button">שכחתי סיסמה</button>
    <p class="gerr" id="gErr" role="alert"></p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(()=>{
const SB=window.supabase.createClient("https://rrqngqxrcvhaeeudrhjz.supabase.co","sb_publishable_Cxxhu4h4CFtIUpqxcb-FTg_DIvC16lY",{auth:{storageKey:"pg-finance-auth",persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const fmt=n=>(+n||0).toLocaleString("he-IL",{minimumFractionDigits:2,maximumFractionDigits:2});
const dd=s=>{if(!s)return"—";const p=String(s).split("-");return p.length===3?`${+p[2]}.${+p[1]}`:s};
const MN={"2026-09":"ספטמבר","2026-10":"אוקטובר","2026-11":"נובמבר","2026-12":"דצמבר"};
const PERIODS=[{k:"2026-09-10",label:"ספטמבר–אוקטובר 2026",months:["2026-09","2026-10"]},{k:"2026-11-12",label:"נובמבר–דצמבר 2026",months:["2026-11","2026-12"]}];
const VAT_RATE=0.18;
let role="none",S={exp:[],docs:[],inc:{}},per=PERIODS[0],tab="all";
try{const s=localStorage.getItem("pgrch");if(s){const p=PERIODS.find(x=>x.k===s);if(p)per=p}}catch(e){}

/* ---------- sign-in ---------- */
async function enter(session){
  if(!session){$("gate").hidden=false;return}
  const {data,error}=await SB.rpc("fin_role");role=error?"none":data;
  if(role!=="admin"&&role!=="accountant"){$("gate").hidden=false;$("gErr").textContent="לחשבון "+((session.user&&session.user.email)||"")+" עוד אין גישה לאזור הזה. צריך לבקש מטל לפתוח גישה";return}
  $("gate").hidden=true;
  $("who").innerHTML=`<span>${esc(session.user.email)}</span>${role==="admin"?'<a href="../">לאפליקציית הכספים</a>':""}<button id="out" type="button">יציאה</button>`;
  $("out").onclick=async()=>{await SB.auth.signOut({scope:"local"});location.reload()};
  await load();
}
$("gForm").addEventListener("submit",async e=>{e.preventDefault();$("gErr").textContent="";$("gGo").disabled=true;
  const em=$("gEm").value.trim(),pw=$("gPw").value;
  if($("gForm").dataset.mode==="new"){
    const {data,error}=await SB.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.href}});
    $("gGo").disabled=false;
    if(error){$("gErr").textContent=/registered|exists/i.test(error.message)?"המייל כבר רשום. אפשר להיכנס, או ללחוץ 'שכחתי סיסמה'":"לא הצלחתי ליצור סיסמה: "+error.message;return}
    if(data.session)return enter(data.session);
    $("gErr").style.color="var(--ok)";$("gErr").textContent="נשלח אליך מייל לאישור. אחרי האישור נכנסים כאן עם המייל והסיסמה";return}
  const {data,error}=await SB.auth.signInWithPassword({email:em,password:pw});
  $("gGo").disabled=false;if(error){$("gErr").textContent="המייל או הסיסמה לא נכונים";return}enter(data.session)});
$("gNew").addEventListener("click",()=>{const f=$("gForm");const n=f.dataset.mode!=="new";f.dataset.mode=n?"new":"";
  $("gSub").textContent=n?"בוחרים סיסמה (8 תווים לפחות) למייל שלך":"כניסה עם המייל והסיסמה שלך";$("gGo").textContent=n?"יצירת סיסמה":"כניסה";$("gNew").textContent=n?"כבר יש לי סיסמה":"כניסה ראשונה? יצירת סיסמה";$("gPw").autocomplete=n?"new-password":"current-password";$("gErr").textContent=""});
$("gForgot").addEventListener("click",async()=>{const em=$("gEm").value.trim();if(!em){$("gErr").textContent="קודם רושמים מייל";return}
  const {error}=await SB.auth.resetPasswordForEmail(em,{redirectTo:location.origin+"/playground-app/"});
  $("gErr").textContent=error?"לא הצלחתי לשלוח מייל":"נשלח מייל לאיפוס הסיסמה"});

/* ---------- data ---------- */
async function load(){
  const [ex,dc,mi]=await Promise.all([
    SB.from("fin_docs").select("id,data").eq("collection","expenses").limit(5000),
    SB.from("fin_docs").select("id,data").eq("collection","docs").limit(5000),
    SB.from("fin_docs").select("data").eq("collection","meta").eq("id","income").maybeSingle()]);
  if(ex.error||dc.error){$("main").innerHTML='<div class="empty">לא הצלחתי לטעון את הנתונים. נסו לרענן.</div>';return}
  S.exp=(ex.data||[]).map(r=>({id:r.id,...r.data}));
  S.docs=(dc.data||[]).map(r=>({id:r.id,...r.data}));
  S.inc=(mi.data&&mi.data.data)||{};
  render();
}
const docsOf=id=>S.docs.filter(d=>d.expenseId===id);
const docVat=d=>d.ext&&d.ext.tax===true&&d.ext.vat!=null&&+d.ext.vat>0?r2(d.ext.vat):0;
function calc(p){
  const exp=S.exp.filter(r=>p.months.includes(r.period)).sort((a,b)=>(a.date||a.period+"-99").localeCompare(b.date||b.period+"-99"));
  const rows=exp.map(r=>{const ds=docsOf(r.id);return {...r,ds,vat:r2(ds.reduce((s,d)=>s+docVat(d),0)),unread:ds.some(d=>!d.ext||d.ext.vat==null)}});
  const inc=p.months.map(m=>{const a=S.inc[m]==null?null:+S.inc[m],c=+S.inc[m+"_cash"]||0;const g=a==null?null:a+c;return {m,arbox:a,cash:c,gross:g,vat:g==null?null:r2(g*VAT_RATE/(1+VAT_RATE))}});
  const incG=r2(inc.reduce((s,x)=>s+(x.gross||0),0)),outVat=r2(inc.reduce((s,x)=>s+(x.vat||0),0));
  const expT=r2(rows.reduce((s,r)=>s+(+r.amount||0),0)),inVat=r2(rows.reduce((s,r)=>s+r.vat,0));
  const taxDocs=[];rows.forEach(r=>r.ds.forEach(d=>{if(docVat(d)>0)taxDocs.push({r,d})}));
  const missing=rows.filter(r=>r.invoice==="חסר");
  return {rows,inc,incG,outVat,expT,inVat,due:r2(outVat-inVat),taxDocs,missing,incMissing:inc.some(x=>x.gross==null)};
}
const chip=v=>v==="התקבלה"?'<span class="chip c-ok">יש מסמך</span>':v==="חסר"?'<span class="chip c-bad">חסר</span>':'<span class="chip c-na">לא נדרש</span>';
const flink=d=>`<a href="#" data-open="${esc(d.assetId)}" title="${esc(d.name)}">📎 ${esc((d.ext&&d.ext.docNo)?("מס׳ "+d.ext.docNo):d.name)}</a>`;
const ICON_DL='<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';

function render(){
  const c=calc(per);const nDocs=c.rows.reduce((s,r)=>s+r.ds.length,0);
  const rowsT=tab==="vat"?c.rows.filter(r=>r.vat>0):tab==="miss"?c.missing:c.rows;
  $("main").innerHTML=`
  <div class="bar">
    <div class="periods" role="group" aria-label="תקופת דיווח">${PERIODS.map(p=>`<button type="button" data-p="${p.k}" aria-pressed="${p.k===per.k}">${p.label}</button>`).join("")}</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="prog" id="prog"></span><button class="btn pri" id="dl" type="button" ${nDocs?"":"disabled"}>${ICON_DL}הורדת כל המסמכים + אקסל (${nDocs})</button></div>
  </div>
  <div class="grid kpis">
    <div class="card kpi"><span class="l">הכנסות כולל מע״מ</span><span class="v">${fmt(c.incG)} ₪</span><span class="h">${c.incMissing?"חלק מהחודשים עוד לא נסגרו":"לפי קבלות ארבוקס"}</span></div>
    <div class="card kpi"><span class="l">מע״מ עסקאות</span><span class="v">${fmt(c.outVat)} ₪</span><span class="h">18% מתוך ההכנסות</span></div>
    <div class="card kpi"><span class="l">הוצאות</span><span class="v">${fmt(c.expT)} ₪</span><span class="h">${c.rows.length} שורות · ${c.missing.length} בלי מסמך</span></div>
    <div class="card kpi"><span class="l">מע״מ תשומות</span><span class="v">${fmt(c.inVat)} ₪</span><span class="h">מתוך ${c.taxDocs.length} חשבוניות מס</span></div>
    <div class="card kpi hl"><span class="l">${c.due>=0?"מע״מ לתשלום":"מע״מ להחזר"}</span><span class="v">${fmt(Math.abs(c.due))} ₪</span><span class="h">עסקאות פחות תשומות</span></div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
    <div class="card"><h2>חישוב המע״מ · ${per.label}</h2><p class="cap">לפי חודש, מתוך הנתונים במערכת</p>
      <div class="tbl"><table><thead><tr><th>חודש</th><th class="amt">הכנסות</th><th class="amt">מע״מ עסקאות</th><th class="amt">מע״מ תשומות</th></tr></thead><tbody>
      ${per.months.map(m=>{const i=c.inc.find(x=>x.m===m);const iv=r2(c.rows.filter(r=>r.period===m).reduce((s,r)=>s+r.vat,0));return `<tr><td>${MN[m]}</td><td class="amt num">${i.gross==null?"—":fmt(i.gross)}</td><td class="amt num">${i.vat==null?"—":fmt(i.vat)}</td><td class="amt num">${fmt(iv)}</td></tr>`}).join("")}
      </tbody><tfoot><tr><td>סה״כ</td><td class="amt num">${fmt(c.incG)}</td><td class="amt num">${fmt(c.outVat)}</td><td class="amt num">${fmt(c.inVat)}</td></tr></tfoot></table></div>
      <div class="calc" style="margin-top:12px"><div><span>מע״מ עסקאות</span><span class="num">${fmt(c.outVat)} ₪</span></div><div><span>פחות מע״מ תשומות</span><span class="num">−${fmt(c.inVat)} ₪</span></div><div><span>${c.due>=0?"לתשלום":"להחזר"}</span><span class="num">${fmt(Math.abs(c.due))} ₪</span></div></div>
      <p class="note">מע״מ תשומות נספר רק מחשבוניות מס, לפי המע״מ שמודפס בהן. ההחלטה מה מותר בקיזוז נשארת אצל רואה החשבון.</p></div>
    <div class="card"><h2>הכנסות</h2><p class="cap">קבלות ארבוקס ומזומן, כולל מע״מ</p>
      <div class="tbl"><table><thead><tr><th>חודש</th><th class="amt">ארבוקס</th><th class="amt">מזומן</th><th class="amt">סה״כ</th></tr></thead><tbody>
      ${c.inc.map(i=>`<tr><td>${MN[i.m]}</td><td class="amt num">${i.arbox==null?"—":fmt(i.arbox)}</td><td class="amt num">${fmt(i.cash)}</td><td class="amt num">${i.gross==null?"עוד לא נסגר":fmt(i.gross)}</td></tr>`).join("")}
      </tbody></table></div></div>
  </div>
  <div class="card" style="margin-bottom:14px"><h2>חשבוניות מס עם מע״מ</h2><p class="cap">${c.taxDocs.length} חשבוניות · מע״מ ${fmt(c.inVat)} ₪</p>
    ${c.taxDocs.length?`<div class="tbl"><table><thead><tr><th>תאריך</th><th>ספק</th><th>מסמך</th><th class="amt">סכום החשבונית</th><th class="amt">מע״מ</th></tr></thead><tbody>
    ${c.taxDocs.map(({r,d})=>`<tr><td class="num">${dd(d.ext.date||r.date)}</td><td>${esc(d.ext.vendor||r.vendor)}</td><td><div class="files">${flink(d)}</div></td><td class="amt num">${d.ext.total==null?"—":fmt(d.ext.total)}</td><td class="amt num">${fmt(docVat(d))}</td></tr>`).join("")}
    </tbody><tfoot><tr><td colspan="4">סה״כ מע״מ תשומות</td><td class="amt num">${fmt(c.inVat)}</td></tr></tfoot></table></div>`:'<div class="empty">אין עדיין חשבוניות מס בתקופה הזו</div>'}</div>
  <div class="card"><h2>כל ההוצאות</h2><p class="cap">לפי תאריך החיוב בבנק או בכרטיס</p>
    <div class="tabs" role="group">${[["all","הכול ("+c.rows.length+")"],["vat","עם מע״מ ("+c.rows.filter(r=>r.vat>0).length+")"],["miss","בלי מסמך ("+c.missing.length+")"]].map(([k,t])=>`<button type="button" data-tab="${k}" aria-pressed="${tab===k}">${t}</button>`).join("")}</div>
    ${rowsT.length?`<div class="tbl"><table><thead><tr><th>תאריך</th><th>ספק</th><th>קטגוריה</th><th class="amt">סכום</th><th class="amt">מע״מ</th><th>מסמך</th></tr></thead><tbody>
    ${rowsT.map(r=>`<tr><td class="num">${dd(r.date)}</td><td>${esc(r.vendor)}${r.source?`<div class="d">${esc(r.source)}</div>`:""}</td><td>${esc(r.category||"")}</td><td class="amt num">${fmt(r.amount)}</td><td class="amt num">${r.vat?fmt(r.vat):"—"}</td><td>${chip(r.invoice)}${r.ds.length?`<div class="files" style="margin-top:4px">${r.ds.map(flink).join("")}</div>`:""}</td></tr>`).join("")}
    </tbody></table></div>`:'<div class="empty">אין שורות</div>'}</div>`;
}

/* ---------- actions ---------- */
document.addEventListener("click",async e=>{
  const pb=e.target.closest("[data-p]");if(pb){per=PERIODS.find(p=>p.k===pb.dataset.p)||per;try{localStorage.setItem("pgrch",per.k)}catch(_){}render();return}
  const tb=e.target.closest("[data-tab]");if(tb){tab=tb.dataset.tab;render();return}
  const op=e.target.closest("[data-open]");if(op){e.preventDefault();const w=window.open("","_blank");
    const {data,error}=await SB.storage.from("fin").createSignedUrl(op.dataset.open,600);
    if(error||!data){if(w)w.close();alert("לא הצלחתי לפתוח את המסמך");return}if(w)w.location=data.signedUrl;else location.href=data.signedUrl;return}
  if(e.target.closest("#dl"))downloadAll();
});
const loadJs=src=>new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)});
const safe=s=>String(s||"").replace(/[\\/:*?"<>|\n\r]+/g," ").replace(/\s+/g," ").trim().slice(0,60);
async function downloadAll(){
  const btn=$("dl"),pg=$("prog");btn.disabled=true;
  try{
    pg.textContent="מכין…";
    await Promise.all([loadJs("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"),loadJs("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js")]);
    const c=calc(per);const zip=new JSZip();
    const items=[];c.rows.forEach(r=>r.ds.forEach(d=>items.push({r,d})));
    const {data:urls,error}=await SB.storage.from("fin").createSignedUrls(items.map(x=>x.d.assetId),900);
    if(error)throw error;
    const used=new Set();let ok=0,fail=[];
    for(let i=0;i<items.length;i++){
      const {r,d}=items[i];pg.textContent=`מוריד ${i+1} מתוך ${items.length}…`;
      const u=urls&&urls[i]&&urls[i].signedUrl;
      try{if(!u)throw 0;const b=await (await fetch(u)).blob();
        const ext=(d.name||"").match(/\.[a-z0-9]{2,5}$/i);let fn=`${MN[r.period]}/${r.date||r.period}_${safe(r.vendor)}_${fmt(r.amount).replace(/,/g,"")}${ext?ext[0].toLowerCase():""}`;
        let k=fn,n=2;while(used.has(k)){k=fn.replace(/(\.[a-z0-9]+)?$/i,m=>`_${n}${m}`);n++}used.add(k);d._zip=k;zip.file(k,b);ok++}
      catch(_){fail.push(d.name)}}
    pg.textContent="מכין את האקסל…";
    const sum=[["פלייגראונד סטודיו · עוסק מורשה 558563573"],["תקופת דיווח",per.label],[],["חודש","הכנסות כולל מע״מ","מע״מ עסקאות","הוצאות","מע״מ תשומות"]];
    per.months.forEach(m=>{const i=c.inc.find(x=>x.m===m);const rs=c.rows.filter(r=>r.period===m);sum.push([MN[m],i.gross??"",i.vat??"",r2(rs.reduce((s,r)=>s+(+r.amount||0),0)),r2(rs.reduce((s,r)=>s+r.vat,0))])});
    sum.push(["סה״כ",c.incG,c.outVat,c.expT,c.inVat],[],[c.due>=0?"מע״מ לתשלום":"מע״מ להחזר",Math.abs(c.due)],[],["מע״מ עסקאות = 18/118 מההכנסות (כל ההכנסות חייבות מע״מ). מע״מ תשומות = המע״מ המודפס בחשבוניות מס בלבד."]);
    const exp=[["תאריך","חודש","ספק","קטגוריה","אמצעי תשלום","סכום","מע״מ בחשבונית מס","מסמך","קבצים בתיקייה","הערה"]].concat(c.rows.map(r=>[r.date||"",MN[r.period],r.vendor,r.category||"",r.source||"",+r.amount||0,r.vat||0,r.invoice,r.ds.map(d=>d._zip||"").filter(Boolean).join(" | "),r.note||""]));
    const tax=[["תאריך המסמך","ספק","מספר מסמך","סכום החשבונית","מע״מ","שורת ההוצאה","קובץ"]].concat(c.taxDocs.map(({r,d})=>[d.ext.date||"",d.ext.vendor||r.vendor,d.ext.docNo||"",d.ext.total??"",docVat(d),`${r.date||""} ${r.vendor} ${r.amount}`,d._zip||""]));
    const inc=[["חודש","קבלות ארבוקס","מזומן","סה״כ כולל מע״מ","מע״מ עסקאות"]].concat(c.inc.map(i=>[MN[i.m],i.arbox??"",i.cash,i.gross??"",i.vat??""]));
    const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
    const add=(rows,name,w)=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,name)};
    add(sum,"סיכום מע״מ",[22,18,16,14,16]);add(exp,"הוצאות",[12,10,30,18,16,12,14,10,50,40]);add(tax,"חשבוניות מס",[12,28,16,14,12,40,50]);add(inc,"הכנסות",[12,14,10,16,14]);
    zip.file(`סיכום ${per.label}.xlsx`,XLSX.write(wb,{bookType:"xlsx",type:"array"}));
    pg.textContent="דוחס…";
    const blob=await zip.generateAsync({type:"blob"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`פלייגראונד ${per.label}.zip`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
    pg.textContent=fail.length?`ירדו ${ok} קבצים. ${fail.length} לא ירדו`:`ירדו ${ok} קבצים ואקסל`;
  }catch(err){pg.textContent="ההורדה נכשלה. נסו שוב"}
  finally{btn.disabled=false}
}
SB.auth.getSession().then(({data})=>enter(data.session));
})();
</script>
