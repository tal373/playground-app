<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>בונה התכניות של פלייגראונד</title>
<link rel="icon" href="../icon-192.png">
<script>window.PG_STANDALONE=true</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Direction — coach's planning notebook: warm paper neutrals, ink text, one marker-blue accent.
   Each class card carries a thin colored top edge (Power Lab ink, Method terracotta, Flex sage) — the signature.
   The week coverage strip is the one rich moment; everything else stays quiet. */
:root{
  --bg:#f4f2ed;--paper:#fffefb;--paper2:#f8f6f1;--ink:#1d1c19;--ink2:#5f5b53;--ink3:#938e84;
  --line:rgba(29,28,25,.10);--line2:rgba(29,28,25,.06);
  --acc:#2c55c9;--acc-ink:#2347a8;--acc-soft:#e9eefb;--btn:#1d1c19;--btn-ink:#fffefb;
  --pl:#2b2a26;--me:#b4532a;--fx:#4f8276;
  --ok:#2f7d5b;--ok-soft:#e6f2ec;--warn:#9a6212;--warn-soft:#f8eedb;--bad:#b3352f;--bad-soft:#f8e5e3;
  --p-HP:#5068ad;--p-VP:#7a68ad;--p-HR:#3d8670;--p-VR:#2f7a89;--p-HG:#a4703a;--p-SQ:#b3553e;--p-LG:#bd6f78;--p-CO:#7f7a70;--p-CD:#bf9536;--p-MB:#b6b1a6;--p-SH:#a3a6b8;--p-ML:#b9ad95;--p-AR:#9b86ad;--p-OT:#c4bfb4;
  --f-b:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--f-m:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sh:0 1px 2px rgba(29,28,25,.05),0 4px 16px rgba(29,28,25,.04);
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--paper:#1f1e1b;--paper2:#262521;--ink:#eeebe4;--ink2:#b3ada2;--ink3:#857f74;--line:rgba(238,235,228,.10);--line2:rgba(238,235,228,.06);--acc:#7f9cf0;--acc-ink:#9fb5f5;--acc-soft:#252d45;--btn:#eeebe4;--btn-ink:#1d1c19;--pl:#d9d5cc;--me:#e08a5e;--fx:#86b8ab;--ok:#6cc29a;--ok-soft:#1d3329;--warn:#e0a957;--warn-soft:#382c17;--bad:#ef8a83;--bad-soft:#3b201e;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171614;--paper:#1f1e1b;--paper2:#262521;--ink:#eeebe4;--ink2:#b3ada2;--ink3:#857f74;--line:rgba(238,235,228,.10);--line2:rgba(238,235,228,.06);--acc:#7f9cf0;--acc-ink:#9fb5f5;--acc-soft:#252d45;--btn:#eeebe4;--btn-ink:#1d1c19;--pl:#d9d5cc;--me:#e08a5e;--fx:#86b8ab;--ok:#6cc29a;--ok-soft:#1d3329;--warn:#e0a957;--warn-soft:#382c17;--bad:#ef8a83;--bad-soft:#3b201e;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:14px;line-height:1.5;direction:rtl;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.en{direction:ltr;unicode-bidi:isolate}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:16px;height:16px;flex:0 0 16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding-block:12px 0;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.bar .row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo i{width:32px;height:32px;border-radius:8px;background:var(--ink);display:grid;place-items:center;color:var(--paper);font-style:normal;font-weight:600;font-size:12px;letter-spacing:.02em}
.logo div{font-weight:600;font-size:16px;line-height:1.2}
.logo small{display:block;font-weight:400;font-size:12px;color:var(--ink3)}
.nav{display:flex;gap:4px;background:var(--paper2);border:1px solid var(--line2);border-radius:10px;padding:4px}
.nav a{color:var(--ink2);text-decoration:none;font-weight:500;padding:6px 14px;border-radius:7px;font-size:14px;transition:background-color .15s var(--ease),color .15s var(--ease)}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(29,28,25,.06)}
.grow{flex:1}
.conn{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.conn b{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.conn.on b{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.conn button{background:var(--btn);color:var(--btn-ink);border:0;border-radius:7px;padding:4px 10px;font-size:12px;font-weight:500}
.saved{font-size:12px;color:var(--ink3);min-width:56px}
.ibtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line);color:var(--ink2);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500}
.ibtn:hover:not(:disabled){color:var(--ink);background:var(--paper2)}
.ibtn:disabled{opacity:.4;cursor:default}
/* cycle strip — weeks as notebook tabs */
.cycle{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.cyc{flex:0 0 auto;border:0;background:transparent;color:var(--ink3);border-radius:0;padding:8px 14px 10px;text-align:right;min-width:132px;border-bottom:2px solid transparent;transition:color .15s var(--ease),border-color .15s var(--ease)}
.cyc:hover{color:var(--ink2)}
.cyc b{display:block;color:var(--ink2);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.cyc span{font-size:12px}
.cyc[aria-current="true"]{border-bottom-color:var(--ink);color:var(--ink2)}
.cyc[aria-current="true"] b{color:var(--ink);font-weight:600}
.cyc .ph{display:inline;margin-inline-start:4px;font-weight:500;color:inherit;background:none;padding:0}
.cyc[aria-current="true"] .ph{color:var(--acc-ink)}
/* page */
main{padding-block:24px 120px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:2200px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.h1{font-weight:600;font-size:26px;line-height:1.2;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.sub{color:var(--ink2);font-size:13px;margin-top:4px}
.sub b{font-weight:500}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 14px;font-weight:500;font-size:13.5px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center;color:var(--ink);transition:background-color .15s var(--ease),border-color .15s var(--ease)}
.btn:hover:not(:disabled){background:var(--paper2);border-color:rgba(29,28,25,.18)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.pri:hover:not(:disabled){background:#33312c;border-color:#33312c}
.btn.aig{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px;gap:6px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover:not(:disabled){background:var(--paper2);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{background:var(--acc-soft);border-color:transparent;color:var(--acc-ink)}
select.btn{padding-inline-end:10px}
/* the moment: week coverage */
.cov{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));gap:1px;background:var(--line2);border:1px solid var(--line);border-radius:14px;overflow:hidden;flex:1;min-width:min(100%,720px)}
.cvt{background:var(--paper);padding:12px 14px 14px;display:grid;gap:6px;align-content:start}
.cvt .cvl{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.cvt .cvl i{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
.cvt .cvn{font-size:28px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cvt .cvn small{font-size:12px;color:var(--ink3);font-weight:400;margin-inline-start:4px;letter-spacing:0}
.cvt .cvb{display:flex;gap:3px}
.cvt .cvb b{height:4px;flex:1;border-radius:2px;background:var(--line)}
.cvt .cvb b.on{background:var(--cc)}
.cvt.zero{background:var(--bad-soft)}
.cvt.zero .cvn{color:var(--bad)}
.covh{display:flex;align-items:baseline;gap:12px;margin:0 0 8px;font-size:13px;color:var(--ink2)}
.covh b{font-weight:500;color:var(--ink);font-size:14px}
.pc{display:none}
/* board */
.boardwrap{overflow-x:auto;padding-bottom:12px;margin-top:8px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(248px,1fr);grid-template-rows:auto auto auto auto auto;gap:0 12px;min-width:min-content}
.col{grid-row:span 5;display:grid;grid-template-rows:subgrid;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.col:hover{border-color:rgba(29,28,25,.22)}
.col.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.ch{padding:16px 16px 12px;border-bottom:1px solid var(--line2);display:grid;gap:6px;position:relative}
.ch::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,var(--pl))}
.ch .d{display:flex;align-items:baseline;gap:8px}
.ch .day{font-weight:600;font-size:17px}
.ch .dt{color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums}
.tag{font-size:12.5px;font-weight:500;color:var(--c,var(--pl))}
.ch .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.st{display:inline-flex;align-items:center;gap:5px;font-weight:500;color:var(--ok)}
.st i{width:6px;height:6px;border-radius:50%;background:currentColor}
.st.w{color:var(--warn)}.st.b{color:var(--bad)}
.pub{font-size:11.5px;font-weight:500;color:var(--ok)}
.pub.dr{color:var(--ink3)}
.sec{padding:10px 16px 12px;border-bottom:1px solid var(--line2);min-height:44px}
.sec:last-child{border-bottom:0}
.sec .lbl{font-size:12px;font-weight:500;color:var(--ink3);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.ex{display:flex;align-items:baseline;gap:8px;font-size:13px;line-height:1.45;min-width:0;padding:2px 0}
.ex i{flex:0 0 6px;height:6px;border-radius:2px;background:var(--p-OT);transform:translateY(-2px)}
.ex .nm{direction:ltr;unicode-bidi:isolate;min-width:0;overflow-wrap:anywhere;color:var(--ink)}
.ex .s{color:var(--ink3);font-family:var(--f-m);font-size:11.5px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.ex.bad i{background:var(--bad)!important;box-shadow:0 0 0 2px var(--bad-soft)}
.ex.bad .nm{color:var(--bad)}
.ex.warn i{background:var(--warn)!important;box-shadow:0 0 0 2px var(--warn-soft)}
.ex.empty{color:var(--ink3)}
.fmt{font-family:var(--f-m);font-size:11px;color:var(--ink3);direction:ltr;text-align:left;font-weight:400}
/* drawer */
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(680px,100%);background:var(--paper);z-index:35;border-inline-start:1px solid var(--line);box-shadow:-24px 0 64px rgba(29,28,25,.14);display:flex;flex-direction:column;transform:translateX(-105%);transition:transform .24s var(--ease);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.col,.btn{transition:none}}
.scrim{position:fixed;inset:0;background:rgba(29,28,25,.22);z-index:34}
.dh{padding:20px 24px 16px;border-bottom:1px solid var(--line);display:grid;gap:12px;position:relative}
.dh::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,var(--pl))}
.dh .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dh .t{font-weight:600;font-size:20px}
.dh input.goal{flex:1;min-width:200px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--paper2)}
.gauges{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.g{display:grid;gap:4px;min-width:96px}
.g small{font-size:12px;color:var(--ink3)}
.g .v{font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.meter{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.meter b{display:block;height:100%;background:var(--ok);border-radius:2px}
.meter.w b{background:var(--warn)}.meter.b b{background:var(--bad)}
.dots{display:flex;gap:3px}
.dots i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--ink2)}.dots.w i.on{background:var(--warn)}.dots.b i.on{background:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 24px}
.tabs button{border:0;background:none;padding:12px 12px;font-weight:500;font-size:14px;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s var(--ease)}
.tabs button:hover{color:var(--ink2)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.db{overflow:auto;padding:20px 24px 48px;display:grid;gap:16px;align-content:start}
.issues{display:flex;gap:6px;flex-wrap:wrap}
.iss{font-size:12.5px;font-weight:500;border-radius:7px;padding:4px 10px;background:var(--bad-soft);color:var(--bad)}
.iss.warn{background:var(--warn-soft);color:var(--warn)}
.iss.ok{background:var(--ok-soft);color:var(--ok)}
.blk{border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.bh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line2);background:var(--paper2);border-radius:12px 12px 0 0}
.bh .bn{font-weight:500;font-size:14px}
.bh input{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:4px 8px;font-size:12.5px}
.bh .fm{flex:1;min-width:150px;direction:ltr;font-family:var(--f-m)}
.bh .rs{width:64px;direction:ltr;text-align:center;font-family:var(--f-m)}
.ln{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line2)}
.ln:last-child{border-bottom:0}
.ln .sets{width:64px;border:1px solid var(--line);border-radius:7px;padding:5px 4px;text-align:center;direction:ltr;font-family:var(--f-m);font-size:12.5px;background:var(--paper2)}
.ln .mid{display:grid;gap:4px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 10px;max-width:100%;font-size:13px;transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.chip:hover{border-color:rgba(29,28,25,.24)}
.chip i{width:6px;height:6px;border-radius:2px;flex:0 0 6px}
.chip .nm{direction:ltr;unicode-bidi:isolate;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bad-soft)}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft)}
.chip.empty{border-style:dashed;color:var(--ink3)}
.ln .tail{border:0;border-bottom:1px dashed var(--line);background:transparent;padding:2px 0;font-size:12px;direction:ltr;font-family:var(--f-m);color:var(--ink2);width:100%}
.ln .msg{font-size:12px;color:var(--bad)}
.ln .msg.w{color:var(--warn)}
.acts{display:flex;gap:2px}
.ic{border:0;background:none;border-radius:7px;width:28px;height:28px;display:inline-grid;place-items:center;color:var(--ink3);transition:background-color .15s var(--ease),color .15s var(--ease)}
.ic:hover{background:var(--paper2);color:var(--ink)}
a.vid{color:var(--ink3);text-decoration:none;font-size:12px;display:inline-flex;align-items:center;gap:4px}
a.vid:hover{color:var(--acc)}
a.vid svg.i{width:14px;height:14px;flex-basis:14px}
.addl{border:0;background:none;color:var(--acc-ink);font-weight:500;font-size:13px;padding:8px 12px}
.empty-note{color:var(--ink3);font-size:13px;padding:12px}
/* read view */
.rv{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rv h4{margin:0;padding:10px 14px;background:var(--paper2);font-size:13.5px;font-weight:500;display:flex;justify-content:space-between;gap:8px}
.rv h4 span{font-family:var(--f-m);font-weight:400;color:var(--ink3);direction:ltr;font-size:12px}
.rv ul{margin:0;padding:8px 14px 12px;list-style:none;display:grid;gap:4px}
.rv li{direction:ltr;text-align:left;font-size:13px;display:flex;gap:8px;justify-content:space-between;align-items:center}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(29,28,25,.32);display:grid;place-items:center;padding:16px}
.mp{width:min(920px,100%);max-height:min(88vh,920px);background:var(--paper);border-radius:16px;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;box-shadow:0 24px 64px rgba(29,28,25,.22)}
.mh{padding:16px 20px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.mh .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mh b{font-weight:500}
.mh input[type=search]{flex:1;min-width:200px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--paper2)}
.flt{display:flex;gap:4px;flex-wrap:wrap}
.flt button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:500;color:var(--ink2);display:inline-flex;gap:6px;align-items:center;transition:background-color .15s var(--ease)}
.flt button:hover{background:var(--paper2)}
.flt button i{width:7px;height:7px;border-radius:2px}
.flt button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ml{overflow:auto;padding:8px 12px 16px}
.grp{font-size:12px;font-weight:500;color:var(--ink3);padding:12px 8px 4px}
.pr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:10px;cursor:pointer;transition:background-color .15s var(--ease)}
.pr:hover,.pr:focus-visible{background:var(--paper2)}
.pr.dim{opacity:.5}
.pr .nm{direction:ltr;unicode-bidi:isolate;font-weight:500;font-size:14px;text-align:right}
.tg{font-size:11.5px;border-radius:6px;padding:1px 7px;background:var(--paper2);color:var(--ink2);font-weight:500;display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line2)}
.tg i{width:6px;height:6px;border-radius:2px}
.tg.S{color:var(--ink)}.tg.M{color:var(--ink2)}.tg.V{color:var(--ink3)}
.tg.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}.tg.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tg.fav{background:var(--acc-soft);color:var(--acc-ink);border-color:transparent}
.tgs{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.bc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;gap:8px;transition:border-color .15s var(--ease)}
.bc:hover{border-color:rgba(29,28,25,.24)}
.bc .h{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink3)}
.bc ul{margin:0;padding:0;list-style:none;direction:ltr;text-align:left;font-size:13px;display:grid;gap:2px}
.bc.dim{opacity:.5}
/* assistant */

<script>
"use strict";
const ICO={"undo": "<path d=\"M9 14 4 9l5-5\"/><path d=\"M4 9h10.5a5.5 5.5 0 0 1 0 11H11\"/>", "x": "<path d=\"M18 6 6 18\"/><path d=\"m6 6 12 12\"/>", "trash": "<path d=\"M3 6h18\"/><path d=\"M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6\"/><path d=\"M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"/>", "play": "<polygon points=\"7 4 19 12 7 20 7 4\"/>", "refresh": "<path d=\"M3 12a9 9 0 0 1 15-6.7L21 8\"/><path d=\"M21 3v5h-5\"/><path d=\"M21 12a9 9 0 0 1-15 6.7L3 16\"/><path d=\"M8 16H3v5\"/>", "library": "<rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/>", "corner": "<path d=\"m15 10 5 5-5 5\"/><path d=\"M4 4v7a4 4 0 0 0 4 4h12\"/>", "shuffle": "<path d=\"M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22\"/><path d=\"m18 2 4 4-4 4\"/><path d=\"M2 6h1.9c1.5 0 2.9.9 3.6 2.2\"/><path d=\"M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8\"/><path d=\"m18 14 4 4-4 4\"/>", "up": "<path d=\"m5 12 7-7 7 7\"/><path d=\"M12 19V5\"/>", "repeat": "<path d=\"m17 2 4 4-4 4\"/><path d=\"M3 11v-1a4 4 0 0 1 4-4h14\"/><path d=\"m7 22-4-4 4-4\"/><path d=\"M21 13v1a4 4 0 0 1-4 4H3\"/>", "msg": "<path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/>", "check": "<path d=\"M20 6 9 17l-5-5\"/>", "sheet": "<path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\"/><path d=\"M14 2v4a2 2 0 0 0 2 2h4\"/><path d=\"M8 13h8\"/><path d=\"M8 17h8\"/><path d=\"M10 9H8\"/>", "build": "<path d=\"M12 3v18\"/><path d=\"M3 12h18\"/><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/>", "grid": "<path d=\"M3 3h18v18H3z\"/><path d=\"M3 9h18\"/><path d=\"M3 15h18\"/><path d=\"M9 3v18\"/><path d=\"M15 3v18\"/>"};
const ico=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICO[n]}</svg>`;
/* ===================== data layer ===================== */
const PID="rrqngqxrcvhaeeudrhjz";
const DATA={mode:"local",mcp:null,mem:{},
  async init(){
    try{this.mem=JSON.parse(localStorage.getItem("pg-planner-v2")||"{}")}catch(e){this.mem={}}
    const mcp=window.claude?await window.claude.use("mcp").catch(()=>null):null;
    if(!mcp)return false;this.mcp=mcp;
    try{await this.sql("select 1 as ok");this.mode="live";return true}catch(e){this.err=e;return false}
  },
  sb:null,
  async sql(q){
    const r=await this.mcp.callTool("Supabase","execute_sql",{project_id:PID,query:q},{cache:false});
    let p=r.payload;if(p&&typeof p==="object"&&!Array.isArray(p)&&typeof p.result==="string")p=p.result;
    if(Array.isArray(p))return p;
    const s=String(p==null?((r.content||[]).map(c=>c.text||"").join("")):p);
    const a=s.indexOf("\n[");const b=s.lastIndexOf("]");
    if(a<0||b<0){if(/error/i.test(s))throw{code:"sql_error",message:s.slice(0,300)};return[]}
    return JSON.parse(s.slice(a+1,b+1));
  },
  lit(v){return"'"+String(v).replace(/'/g,"''")+"'"},
  dq(json){let t;do{t="pl"+Math.random().toString(36).slice(2,8)}while(json.includes("$"+t+"$"));return"$"+t+"$"+json+"$"+t+"$"},
  async get(path){
    if(this.sb){const {data,error}=await this.sb.from("docs").select("data").eq("path",path).maybeSingle();if(error)throw{code:"sb",message:error.message};return data?data.data:null}
    if(this.mode!=="live")return this.mem[path]||null;
    const rows=await this.sql(`select data from docs where path=${this.lit(path)}`);const d=rows[0]&&rows[0].data;return typeof d==="string"?JSON.parse(d):(d||null);
  },
  async put(path,data){
    if(this.sb){const {error}=await this.sb.from("docs").upsert({path,parent:path.split("/").slice(0,-1).join("/"),data},{onConflict:"path"});if(error)throw{code:"sb",message:error.message};return}
    if(this.mode!=="live"){this.mem[path]=data;try{localStorage.setItem("pg-planner-v2",JSON.stringify(this.mem))}catch(e){}return}
    const parent=path.split("/")[0];
    await this.sql(`insert into docs(path,parent,data,updated_at) values (${this.lit(path)},${this.lit(parent)},${this.dq(JSON.stringify(data))}::jsonb,now()) on conflict (path) do update set data=excluded.data, updated_at=now()`);
  },
  async listW(){
    let rows=[];
    if(this.sb){const {data,error}=await this.sb.from("docs").select("path,data").eq("parent","w").range(0,4999);if(error)throw{code:"sb",message:error.message};rows=(data||[]).map(r=>({p:r.path,d:r.data}));const m={};rows.forEach(x=>m[x.p.slice(2)]=x.d);return m}
    if(this.mode==="live"){const r=await this.sql("select coalesce(json_agg(json_build_object('p',path,'d',data)),'[]'::json) as j from docs where parent='w'");rows=r[0]?r[0].j:[];if(typeof rows==="string")rows=JSON.parse(rows)}
    else{try{rows=await (await fetch("w.json")).json()}catch(e){rows=[]}}
    const m={};rows.forEach(x=>m[x.p.slice(2)]=x.d);
    if(this.mode!=="live")Object.keys(this.mem).filter(k=>k.startsWith("w/")).forEach(k=>m[k.slice(2)]=this.mem[k]);
    return m;
  }
};

    c.blocks.forEach(b=>{if(!b.lines.length||b.lines.some(l=>!l.ex.length))return;const k=b.k==="main"?"A":b.k;const sig=k+":"+b.lines.map(l=>l.ex.join("+")).join("|");
      const rec={sig,k,date:c.date,cls:c.cls,format:b.format,rest:b.rest,lines:b.lines.map(l=>({pre:l.pre,sets:l.sets,ex:[...l.ex],tail:l.raw&&!l.ex.length?l.raw:extractTail(l)}))};

function allClasses(){const m={};Object.keys(W).forEach(k=>{if(/kids|small/.test(k))return;m[k]={id:k,date:k.slice(0,10),cls:k.slice(11),get blocks(){return this._b||(this._b=importDoc(k,W[k]).blocks)}}});if(WK)WK.classes.forEach(c=>m[c.id]=c);return m}
function exOf(c){const o=[];c.blocks.forEach((b,bi)=>b.lines.forEach((l,li)=>l.ex.forEach(id=>o.push({id,k:b.k,bi,li}))));return o}
let UCACHE=new Map();
function usage(t){
  const key=t.id+"|"+(WK?WK._rev:0);if(UCACHE.has(key))return UCACHE.get(key);
  const all=allClasses();const sun=addD(t.date,-wd(t.date)),prev=addD(t.date,-7);const week={},last={},fam={},recent={},inCls={};
  Object.values(all).forEach(c=>{if(c.id===t.id)return;const dd=days(c.date,t.date);const inW=c.date>=sun&&c.date<=addD(sun,6)&&c.date!==t.date,isP=c.date===prev;
    if(!inW&&!isP&&!(dd>0&&dd<=21))return;
    exOf(c).forEach(u=>{const e=EXI[u.id];if(!e)return;const tg=`${DS[wd(c.date)]} ${CLS[c.cls]||c.cls}`;
      if(inW){(week[u.id]=week[u.id]||new Set()).add(tg);if(e.fam&&BK[u.k].sec!=="b")(fam[e.fam]=fam[e.fam]||new Set()).add(tg)}
      if(isP)(last[u.id]=last[u.id]||new Set()).add(tg);
      if(dd>0&&dd<=21)recent[u.id]=Math.min(recent[u.id]||99,dd)})});
  exOf(t).forEach(u=>inCls[u.id]=(inCls[u.id]||0)+1);
  const r={week,last,fam,recent,inCls};UCACHE.set(key,r);return r;
}
function badges(e,U,sec){const b=[],mob=sec==="b";
  if(U.last[e.id])b.push({l:mob?"info":"bad",t:"שבוע שעבר · "+[...U.last[e.id]].join(", ")});
  if(U.week[e.id])b.push({l:mob?"info":"warn",t:"השבוע · "+[...U.week[e.id]].join(", ")});
  else if(e.fam&&!mob&&U.fam[e.fam])b.push({l:"warn",t:"משפחה השבוע · "+[...U.fam[e.fam]].join(", ")});
  return b}
function fmtMin(b){const f=b.format||"";let m;
  if(b.k==="mob")return b.n===1?4:3.5;if(b.k==="fmove")return 11;
  if(m=f.match(/(\d+)\s*Min\s*(AMRAP|EMOM)/i))return+m[1];
  if(/30\/30\/10\s*x\s*3/i.test(f))return b.lines.length*3.5;if(/45\/15\s*x\s*3/i.test(f))return b.lines.length*3;
  if(m=f.match(/Every\s*(\d+):(\d+)\s*x\s*(\d+)/i))return(+m[1]+m[2]/60)*+m[3];
  if(m=f.match(/(\d+)\s*x\s*(\d+):00/))return+m[1]*(+m[2]+1);
  if(m=f.match(/(\d+)\s*Min/i))return+m[1];
  if(m=f.match(/(\d+)\s*Rounds?/i)){const r=+m[1];return Math.round(r*(b.lines.length*1.2+(b.rest||60)/60))}
  return b.k==="met"?12:8}
function check(c){
  const R=[],LF={};const push=(l,label,val)=>R.push({l,label,val});const fl=(bi,li,l,m)=>{(LF[bi+"-"+li]=LF[bi+"-"+li]||[]).push({l,m})};
  const all=exOf(c).map(u=>({...u,e:EXI[u.id]})).filter(u=>u.e);const work=all.filter(u=>BK[u.k].sec!=="b");
  const sh=work.filter(u=>u.e.f.includes("s")),hg=work.filter(u=>u.e.f.includes("h"));
  const eq=new Set();all.forEach(u=>u.e.eq.forEach(q=>{if(q!=="BW")eq.add(q==="KB"||q==="DB"?"DB/KB":q)}));
  c.blocks.forEach((b,bi)=>{if(BK[b.k].sec==="b")return;
    const es=b.lines.flatMap((l,li)=>l.ex.map(id=>({e:EXI[id],li}))).filter(x=>x.e);const unk=b.lines.some(l=>!l.ex.length&&l.raw);const lab=BK[b.k].label(b.n);
    const ly=es.filter(x=>x.e.f.includes("l"));if(ly.length>=2&&b.k!=="met"){push("bad",lab,"שני תרגילים בשכיבה באותו סופר-סט");ly.forEach(x=>fl(bi,x.li,"bad","שכיבה"))}
    if(b.k==="core"||b.k==="fcore"){const pl=es.filter(x=>x.e.f.includes("p"));if(pl.length>=2){push("bad",lab,"שני תרגילי פלאנק");pl.forEach(x=>fl(bi,x.li,"bad","פלאנק"))}

    if(b.k==="A"||b.k==="main"||b.k==="B"){const up=es.some(x=>UPPER.includes(x.e.p)),lo=es.some(x=>LOWER.includes(x.e.p));

      es.filter(x=>x.e.fam==="swing").forEach(x=>{push("bad",lab,"Swing הוא לא תרגיל כוח");fl(bi,x.li,"bad","לא כוח")})}
    const vs=es.filter(x=>x.e.t==="V");if(vs.length>=2){push("bad",lab,"שני תרגילי V באותו סקשן");vs.forEach(x=>fl(bi,x.li,"bad","V שני"))}
    if(b.k==="A"||b.k==="main")vs.forEach(x=>{push("warn",lab,`${x.e.n} הוא V — לא כמיין סט`);fl(bi,x.li,"warn","V במיין")});
    if(b.k==="met"){if(es.filter(x=>x.e.f.includes("h")||["swing","snatch","clean","slam","burpee"].includes(x.e.fam)).length>=2)push("warn",lab,"יותר מתרגיל פאוור אחד");

      Object.values(allClasses()).filter(o=>o.id!==c.id&&o.date!==c.date&&Math.abs(days(o.date,c.date))<3&&isAx(o)).forEach(o=>push("warn","עומס צירי",`${ax.n} · גם ${DAYS[wd(o.date)]} ${CLS[o.cls]||o.cls} צירי — פחות מ-3 ימים`))}}

}

function sidePanel(c,ck){const seen=new Set();const iss=ck.R.filter(r=>r.l!=="info").filter(r=>{const k=r.label+r.val;if(seen.has(k))return false;seen.add(k);return true});

האימון: ${JSON.stringify(app.blocks.map(b=>({name:b.name,format:b.format,rest:b.rest||null,items:b.items.map(i=>i.n)})))}
הדגשים של טל: ${B.notes||"(אין — כתוב לפי האימון)"}`;
  try{B.ai=await SAMPLE.json(prompt,{cache:false});c.brief=B.ai;save()}catch(e){B.err=e.code==="not_granted"?"לא אושר לעמוד להשתמש ב-Claude":"לא הצלחתי לכתוב את הבריף. נסה שוב."}

    case"delcls":if(t.dataset.sure){mutate(()=>WK.classes=WK.classes.filter(x=>x!==c));OPEN=null;return renderAll()}t.dataset.sure=1;t.textContent="למחוק?";return;
    case"pick":PICK={type:"ex",bi,li,xi:+t.dataset.x,flow:false,sec:BK[c.blocks[bi].k].sec,pat:"",q:""};return renderModal();
    case"flow":PICK={type:"ex",bi,li,xi:0,flow:true,sec:"b",pat:"",q:""};return renderModal();
    case"blocks":PICK={type:"blocks",bi};return renderModal();
    case"mclose":PICK=null;return renderModal();
    case"swap":return mutate(()=>{if(!swapLine(c,bi,li))toast("אין עוד אפשרות מתאימה")});
    case"swapblk":return mutate(()=>{if(!swapBlock(c,bi))toast("אין עוד בלוק מתאים בהיסטוריה")});
    case"rm":return mutate(()=>c.blocks[bi].lines.splice(li,1));

    case"add":return mutate(()=>{const b=c.blocks[bi];b.lines.push(L(b.lines.length?b.lines[b.lines.length-1].sets:"10",STR(b.k)&&b.k!=="fstr"&&b.lines.length?"Super Set : ":""))});
    case"mcgen":{const goal=["interval","grind","sprint"][Math.floor(Math.random()*3)];const cand=(HB.met||[]).filter(h=>mcGoal(h.format)===goal&&days(h.date,c.date)>21);const h=cand[Math.floor(Math.random()*cand.length)];if(!h)return toast("אין מבנה מתאים");
      return mutate(()=>{const b=c.blocks[bi];b.format=h.format;b.lines=h.lines.map(()=>L("10"));b.lines.forEach((l,j)=>{l.sets=h.lines[j].sets;l.pre=h.lines[j].pre||""});b.lines.forEach((l,j)=>fillLine(c,bi,j));toast(`מבנה ${GOALN[goal]} מ-${dm(h.date)} עם תרגילים חדשים`)})}
    case"publish":CONFIRM=c.id;return renderDrawer();
    case"pubno":CONFIRM=null;return renderDrawer();
    case"pubok":{t.disabled=true;try{const app=toApp(c);await DATA.put("w/"+c.id,app);W[c.id]=app;c.pub=Date.now();c.changed=false;CONFIRM=null;harvest();save();renderAll();toast(isLive()?"האימון עלה לאפליקציה":"נשמר בתצוגה המקדימה")}catch(e){t.disabled=false;toast(saveErr(e))}return}

    case"newex":LB.ed="new";return renderLib();
    case"rvtog":LB.rv=!LB.rv;LB.sec=LB.rv?"":LB.sec;return renderLib();
    case"heat":HEAT=!HEAT;return renderAll();
    case"drive":{t.disabled=true;t.textContent="מעדכן…";try{await driveSync()}catch(e){toast("Drive: "+((e&&(e.message||e.code))||"שגיאה"))}t.disabled=false;return renderAll()}
    case"rvok":{const e=EXI[t.dataset.id];if(!e)return;if(t.dataset.t)e.t=t.dataset.t;delete e.rv;saveEx();return renderLib()}
    case"rvall":{EX.filter(e=>e.rv&&(!LB.sec||e.sec.includes(LB.sec))).forEach(e=>delete e.rv);saveEx();toast("אושר");return renderLib()}
    case"edex":LB.ed=t.dataset.id;return renderLib();
    case"edcancel":LB.ed=null;return renderLib();
    case"undo":return undo();
    case"connect":{const ok=await DATA.init().catch(()=>false);if(ok){toast("מחובר");await boot(true)}else toast(saveErr(DATA.err));return}
    case"aiclose":AIopen=false;return renderAI();
    case"aistop":if(AICTL)AICTL.abort();return;
  }
});

/* ===================== standalone (GitHub page): Supabase sign-in + AI through the pl-ai function ===================== */
const STANDALONE=!!window.PG_STANDALONE;
function sbSample(){const f=async(input,opts={})=>{
    let msgs=(typeof input==="string"?[{role:"user",content:input}]:input.map(m=>({role:m.role,content:String(m.content||"…")}))).reduce((a,m)=>{const l=a[a.length-1];if(l&&l.role===m.role&&typeof l.content==="string")l.content+="\n\n"+m.content;else a.push({...m});return a},[]);
    const tools=(opts.tools||[]).map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema||{type:"object",properties:{}}}));let text="";
    for(let i=0;i<8;i++){if(opts.signal&&opts.signal.aborted)throw{code:"cancelled",text};
      const {data,error}=await DATA.sb.functions.invoke("pl-ai",{body:{mode:"raw",messages:msgs,tools,max_tokens:3000}});
      if(error||!data||data.error)throw{code:"ai",message:"ai",text};
      const content=data.content||[];const t=content.filter(b=>b.type==="text").map(b=>b.text).join("");if(t){text+=(text?"\n":"")+t;opts.onText&&opts.onText({text,delta:t})}
      if(data.stop_reason!=="tool_use")break;
      msgs.push({role:"assistant",content});const results=[];
      for(const b of content.filter(b=>b.type==="tool_use")){const tool=(opts.tools||[]).find(x=>x.name===b.name);let out;try{out=tool?await tool.execute(b.input||{}):{error:"no tool"}}catch(e){out={error:String((e&&e.message)||e)}}results.push({type:"tool_result",tool_use_id:b.id,content:JSON.stringify(out===undefined?null:out).slice(0,20000)})}
      msgs.push({role:"user",content:results})}
    return{text,truncated:false}};
  f.json=async(input,opts={})=>{const r=await f(typeof input==="string"?input+"\n\nהחזר JSON בלבד, בלי טקסט נוסף.":input,opts);const m=r.text.match(/[\[{][\s\S]*[\]}]/);if(!m)throw{code:"ai"};return JSON.parse(m[0])};return f}
